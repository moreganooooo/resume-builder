# Archived/superseded content is intentionally excluded from every hook
# below -- it's kept for reference, not maintained, and findings there
# (dead-code duplicates, stale docs) aren't actionable.
exclude: '^(resume-engine/archive/|resume-engine/prompts/archive/|docs/archive/)'

repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Type checking. Manual stage: this config was written but its git hook
  # was never installed, so mypy and pydocstyle below had never actually
  # run against the codebase -- 38 mypy errors and 652 pydocstyle findings
  # of pre-existing debt. Blocking every commit on all of it would just
  # mean every commit uses --no-verify, which is worse than an honest
  # "run this deliberately". Run with:
  #   pre-commit run --hook-stage manual mypy --all-files
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        stages: [manual]
        additional_dependencies: ["types-pyyaml", "types-requests"]
        args: ["--ignore-missing-imports"]

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ["-ll"]
        exclude: ^tests/

  # Docstring coverage
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        # Manual, for the same reason as mypy above.
        stages: [manual]
        args: ["--match-dir=scripts"]

  # YAML validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        # No args on purpose: the rules live in .yamllint, which yamllint
        # picks up on its own. This hook used to pass an inline `-d
        # {rules: ...}` override instead, so the hook and a bare
        # `yamllint .` disagreed -- by 456 findings. One config, one
        # answer. (For the record: "trailing-spaces" is the real rule
        # name; "trailing-whitespace" is not, and yamllint exits 255 with
        # "invalid config: no such rule" rather than linting anything.)

  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        # No args on purpose -- skip/ignore-words-list live in
        # pyproject.toml's [tool.codespell], which codespell reads on its
        # own. This hook used to carry its own copy that had drifted out
        # of step with pyproject's, so a bare `codespell scripts tests`
        # reported 35 findings the hook silently did not. Every ignored
        # word is documented, one reason per group, in pyproject.toml.

  # General linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  # Commit message validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v2.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
