# Vendored from career-ops/portals.yml (search_queries: section),
# 2026-07-26 -- 68 real, hand-curated Brave-search sweep queries (mostly
# ATS-platform sweeps: site:boards.greenhouse.io / jobs.ashbyhq.com /
# jobs.lever.co / apply.workable.com / myworkdayjobs.com, each scoped to
# Morgan's target keywords) for discovering companies NOT already in
# tracked_companies.yml. This repo's copy is authoritative going forward.
#
# Needs BRAVE_API_KEY in the active profile's .env (free tier: 2,000
# queries/month at https://api.search.brave.com) -- scripts/scan_ats.py's
# fetch_ats_jobs() runs these through the vendored websearch.mjs provider
# alongside tracked_companies.yml; until that key exists, these produce
# nothing (graceful no-op, not an error -- same pattern as Adzuna/USAJobs
# without their keys).

