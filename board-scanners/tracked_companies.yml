# Vendored from career-ops/portals.yml (tracked_companies: section),
# 2026-07-26 -- 400 real, hand-curated companies Morgan built up in
# career-ops over time (careers_url + api endpoint where known, notes on
# some entries). This repo's copy is authoritative going forward; edit
# here, not in career-ops.
#
# scripts/scan_ats.py resolves each entry to a provider: explicit
# `provider:` field wins; `scan_method: websearch` routes to the
# search-sweep path instead (needs BRAVE_API_KEY, see search_queries.yml);
# otherwise it's pattern-matched from careers_url/api against the ATS
# providers vendored in board-scanners/providers/ (greenhouse, ashby,
# lever, recruitee, smartrecruiters, workable, workday). An entry with
# none of those -- e.g. a bare company-site URL with no api: and no
# provider/scan_method hint -- won't resolve to anything until it gets
# one of those three.
#
# enabled: false entries are skipped entirely (mostly the scan_method:
# websearch ones career-ops had turned off, or a couple of dead boards
# noted inline, e.g. Quizlet 404).

