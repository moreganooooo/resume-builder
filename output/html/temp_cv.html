<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> — Resume</title>
<style>
  @font-face {
    font-family: 'DM Serif Display';
    src: url('./fonts/dm-serif-display-latin.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  @font-face {
    font-family: 'DM Serif Display';
    src: url('./fonts/dm-serif-display-latin-ext.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin-ext.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin-ext.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10.5pt;
    font-weight: 400;
    line-height: 1.6;
    color: #000000;
    background: #ffffff;
    padding: 0;
    margin: 0;
  }

  .page {
    width: 100%;
    max-width: 8.5in;
    margin: 0 auto;
    padding: 0;
  }

  /* === HEADER === */
  .header {
    margin-bottom: 16px;
  }

  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 32pt;
    font-weight: 400;
    color: #000000;
    line-height: 0.5in;
    margin-bottom: 0;
  }

  /* Tagline: Space Grotesk 14pt, hard-coded uppercase in the data string */
  .header-tagline {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14pt;
    font-weight: 400;
    color: #000000;
    line-height: 0.25in;
    margin-bottom: 4px;
    letter-spacing: 0.01em;
  }

  .contact-row {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10pt;
    font-weight: 400;
    line-height: 1;
    color: #000000;
  }

  .contact-row a {
    color: #000000;
    text-decoration: none;
  }

  .contact-row .separator {
    color: #000000;
    padding: 0 3px;
  }

  .header-rule {
    border: none;
    border-top: 0.018cm solid #9aa3af;
    margin-top: 6px;
    margin-bottom: 0;
  }

  /* === SECTIONS === */
  .section {
    margin-bottom: 14px;
  }

  /* Section titles: DM Serif Display 16pt — matches design system spec */
  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16pt;
    font-weight: 400;
    color: #000000;
    border-bottom: 0.018cm solid #9aa3af;
    padding-bottom: 2px;
    margin-bottom: 8px;
    line-height: 1.2;
  }

  /* === PROFESSIONAL SUMMARY === */
  .summary-text {
    font-size: 10.5pt;
    line-height: 1.6;
    color: #000000;
  }

  .summary-text strong {
    font-weight: 600;
  }

  /* === SKILLS === */
  /* Each line is one category rendered as:
     <span class="skill-category">Label:</span> Item, Item, Item */
  .skills-text {
    font-size: 10.5pt;
    line-height: 1.7;
    color: #000000;
  }

  .skill-category {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10.5pt;
    font-weight: 600;
    color: #000000;
  }

  /* === CORE COMPETENCIES === */
  .competencies-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 0;
  }

  .competency-tag {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10pt;
    font-weight: 400;
    color: #000000;
  }

  .competency-tag::after {
    content: ' | ';
    color: #9aa3af;
    padding: 0 4px;
  }

  .competency-tag:last-child::after {
    content: '';
  }

  /* === WORK EXPERIENCE === */
  .job {
    margin-bottom: 14px;
  }

  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 1px;
  }

  .job-company {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10.5pt;
    font-weight: 600;
    color: #000000;
  }

  .job-period {
    font-size: 10pt;
    font-weight: 400;
    color: #000000;
    white-space: nowrap;
  }

  /* Job title: italic, per design system */
  .job-role {
    font-size: 10.5pt;
    font-weight: 400;
    font-style: italic;
    color: #000000;
    margin-bottom: 5px;
  }

  /* Career note: optional one-sentence italic note (Treering only) */
  .career-note {
    font-size: 10pt;
    font-style: italic;
    color: #000000;
    margin-top: 4px;
    margin-bottom: 4px;
    line-height: 1.5;
  }

  .job ul {
    padding-left: 16px;
    margin-top: 4px;
  }

  .job li {
    font-size: 10.5pt;
    line-height: 1.55;
    color: #000000;
    margin-bottom: 4px;
  }

  /* No bold inside bullets per design system */
  .job li strong { font-weight: 400; }

  /* === CERTIFICATIONS === */
  /* Only cert-title is bold; org and year are regular weight */
  .cert-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(90px, max-content) 44px;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 5px;
  }

  .cert-title {
    font-size: 10.5pt;
    font-weight: 600;
    color: #000000;
    min-width: 0;
  }

  .cert-org {
    font-size: 10pt;
    font-weight: 400;
    color: #000000;
    white-space: nowrap;
  }

  .cert-year {
    font-size: 10pt;
    font-weight: 400;
    color: #000000;
    white-space: nowrap;
    text-align: right;
  }

  /* === EDUCATION === */
  .edu-item {
    margin-bottom: 8px;
  }

  .edu-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .edu-title {
    font-weight: 600;
    font-size: 10.5pt;
    color: #000000;
  }

  .edu-year {
    font-size: 10pt;
    font-weight: 400;
    color: #000000;
    white-space: nowrap;
  }

  .edu-desc {
    font-size: 10pt;
    color: #000000;
    margin-top: 2px;
    line-height: 1.5;
  }

  /* Education bullets */
  .edu-item ul {
    padding-left: 16px;
    margin-top: 3px;
  }

  .edu-item li {
    font-size: 10pt;
    line-height: 1.5;
    color: #000000;
    margin-bottom: 2px;
  }

  /* === WHY SECTION === */
  /* First and last sentences italicized via <em> in the data;
     body text is plain; first-person pronouns allowed here only */
  .why-text {
    font-size: 10.5pt;
    line-height: 1.6;
    color: #000000;
  }

  .why-text p {
    margin-bottom: 8px;
  }

  .why-text p:last-child {
    margin-bottom: 0;
  }

  /* Links never break across lines */
  a { white-space: nowrap; }

  /* === PRINT === */
  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page { padding: 0; }
  }

  /* === PAGE BREAK CONTROL === */
  .avoid-break,
  .job,
  .edu-item,
  .cert-item {
    break-inside: avoid;
    page-break-inside: avoid;
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header avoid-break">
    <h1></h1>
    <div class="header-tagline">{{TAGLINE}}</div>
    <div class="contact-row">
      <span></span>
      <span class="separator">|</span>
      <span></span>
      <span class="separator">|</span>
      <a href=""></a>
      <span class="separator">|</span>
      <a href=""></a>
      <span class="separator">|</span>
      <span></span>
    </div>
    <hr class="header-rule">
  </div>

  <!-- PAGE 1: PROFESSIONAL SUMMARY -->
  <div class="section avoid-break">
    <div class="section-title">Professional Summary</div>
    <div class="summary-text"></div>
  </div>

  <!-- PAGE 1: SKILLS (immediately after Summary — highest ATS signal) -->
  <div class="section avoid-break">
    <div class="section-title">Skills</div>
    <div class="skills-text"></div>
  </div>

  <!-- PAGE 1: CORE COMPETENCIES -->
  <div class="section avoid-break">
    <div class="section-title">Core Competencies</div>
    <div class="competencies-grid">
      
    </div>
  </div>

  <!-- PAGE 1 → PAGE 2: WORK EXPERIENCE -->
  <div class="section">
    <div class="section-title">Work Experience</div>
    
  </div>

  <!-- PAGE 2: TRAINING & CERTIFICATIONS -->
  <div class="section avoid-break">
    <div class="section-title">Training & Certifications</div>
    
  </div>

  <!-- PAGE 2: EDUCATION -->
  <div class="section avoid-break">
    <div class="section-title">Education</div>
    
  </div>

  <!-- PAGE 2: WHY [COMPANY]? (optional — omit if not in data or if it causes 3rd page) -->
  {{#if WHY_TEXT}}
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_WHY}}</div>
    <div class="why-text">{{WHY_TEXT}}</div>
  </div>
  {{/if}}

</div>
</body>
</html>
