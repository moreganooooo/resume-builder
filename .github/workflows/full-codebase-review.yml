name: Full Codebase Review

on:
  workflow_dispatch:  # Manual trigger via GitHub UI
  schedule:
    - cron: '0 2 * * 0'  # Weekly: Sunday at 2 AM UTC

permissions:
  contents: read
  issues: write

jobs:
  full-review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Full import check with isort
      run: |
        isort --check-only --diff scripts/ tests/ || true

    - name: Full formatting check with black
      run: |
        black --check --diff scripts/ tests/ || true

    - name: Full type check with mypy
      run: |
        mypy scripts/ --ignore-missing-imports || true

    - name: Full security scan with bandit
      run: |
        bandit -r scripts/ -ll || true

    - name: Full code quality with pylint
      run: |
        PYTHONPATH=scripts pylint $(git ls-files '*.py') --exit-zero || true

    - name: Full complexity analysis with radon
      run: |
        radon cc scripts/ -a -nb || true

    - name: Full docstring coverage with pydocstyle
      run: |
        pydocstyle scripts/ --match-dir=scripts || true

    - name: Full YAML validation
      run: |
        yamllint -d "{rules: {line-length: {max: 120}, trailing-whitespace: disable}}" profiles/ scripts/ docs/ || true

    - name: Full spell check
      run: |
        codespell scripts/ tests/ docs/ --skip="*.json,*.csv,*.db,*.pyc" || true

    - name: Full vulnerability scan
      run: |
        safety check --json || true

    - name: Run all unit tests
      run: |
        python -m unittest discover -s tests -v

    - name: Full coverage report
      run: |
        coverage run -m unittest discover -s tests
        coverage report --fail-under=60 || true
        coverage xml

    - name: Create summary report
      if: always()
      run: |
        echo "## Full Codebase Review Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Python Version: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Tools Run:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ isort (import sorting)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ black (code formatting)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ mypy (type checking)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ bandit (security)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ pylint (code quality)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ radon (complexity)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ pydocstyle (docstrings)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ yamllint (YAML validation)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ codespell (spell check)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ safety (vulnerability scan)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ unittest (test suite)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ coverage (code coverage)" >> $GITHUB_STEP_SUMMARY
