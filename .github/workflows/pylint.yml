name: Code Quality & Tests

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      RESUME_BUILDER_TESTING: "1"
      PYTHONPATH: "scripts"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Check imports with isort
      run: |
        isort --check-only scripts/ tests/
    - name: Check code formatting with black
      run: |
        black --check scripts/ tests/
    - name: Type checking with mypy
      run: |
        mypy scripts/ --ignore-missing-imports || true
    - name: Security scanning with bandit
      run: |
        bandit -r scripts/ -ll -q
    - name: Code quality with pylint
      run: |
        PYTHONPATH=scripts pylint $(git ls-files '*.py') --rcfile=.pylintrc --fail-under=8.0
    - name: Complexity analysis with radon
      run: |
        radon cc scripts/ -a -nb
    - name: Docstring coverage with pydocstyle
      run: |
        pydocstyle scripts/ --match-dir=scripts || true
    - name: YAML validation with yamllint
      run: |
        yamllint -d "{rules: {line-length: disable, trailing-spaces: disable}}" profiles/ scripts/ || true
    - name: Spell check with codespell
      run: |
        codespell scripts/ tests/ docs/ --skip="*.json,*.csv,*.db,*.pyc" || true
    - name: Check for vulnerable dependencies
      run: |
        safety check --json || true
    - name: Run unit tests and code coverage
      run: |
        coverage run --source=scripts -m unittest discover -s tests -v
        coverage report --fail-under=60

  go-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.3.0
      with:
        go-version: 'stable'
        cache-dependency-path: dashboard/go.sum
    - name: Check Go vet
      run: |
        cd dashboard && go vet ./...
    - name: Check color linting
      run: |
        go run dashboard/tools/lint_colors.go
    - name: Run golangci-lint
      run: |
        cd dashboard
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
        $(go env GOPATH)/bin/golangci-lint run --timeout=5m || true
    - name: Run Go tests
      run: |
        cd dashboard && go test ./...

  node-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - name: Install dependencies
      run: npm ci
    - name: Run board-scanners provider tests
      run: npm test
      timeout-minutes: 2
