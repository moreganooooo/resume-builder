name: Code Quality & Tests

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Check imports with isort
      run: |
        isort --check-only scripts/ tests/
    - name: Check code formatting with black
      run: |
        black --check scripts/ tests/
    - name: Type checking with mypy
      run: |
        mypy scripts/ --ignore-missing-imports || true
    - name: Security scanning with bandit
      run: |
        bandit -r scripts/ -ll -q
    - name: Code quality with pylint
      run: |
        PYTHONPATH=scripts pylint $(git ls-files '*.py') --rcfile=.pylintrc --fail-under=8.0
    - name: Complexity analysis with radon
      run: |
        radon cc scripts/ -a -nb
    - name: Docstring coverage with pydocstyle
      run: |
        pydocstyle scripts/ --match-dir=scripts || true
    - name: YAML validation with yamllint
      run: |
        yamllint -d "{rules: {line-length: {max: 120}, trailing-whitespace: disable}}" profiles/ scripts/ || true
    - name: Spell check with codespell
      run: |
        codespell scripts/ tests/ docs/ --skip="*.json,*.csv,*.db,*.pyc" || true
    - name: Check for vulnerable dependencies
      run: |
        safety check --json || true
    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -v
    - name: Check code coverage
      run: |
        coverage run -m unittest discover -s tests
        coverage report --fail-under=60

  go-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache-dependency-path: dashboard/go.sum
    - name: Check Go vet
      run: |
        cd dashboard && go vet ./...
    - name: Check color linting
      run: |
        go run dashboard/tools/lint_colors.go
    - name: Run golangci-lint
      run: |
        cd dashboard
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
        $(go env GOPATH)/bin/golangci-lint run --timeout=5m || true
    - name: Run Go tests
      run: |
        cd dashboard && go test ./...
