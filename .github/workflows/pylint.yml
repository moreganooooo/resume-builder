name: Code Quality & Tests

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Check imports with isort
      run: |
        isort --check-only scripts/ resume_engine/ tests/
    - name: Check code formatting with black
      run: |
        black --check scripts/ resume_engine/ tests/
    - name: Type checking with mypy
      run: |
        mypy scripts/ resume_engine/ --ignore-missing-imports
    - name: Security scanning with bandit
      run: |
        bandit -r scripts/ resume_engine/ -ll -q
    - name: Code quality with pylint
      run: |
        pylint $(git ls-files '*.py') --exit-zero
    - name: Complexity analysis with radon
      run: |
        radon cc scripts/ resume_engine/ -a -nb
    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -v
    - name: Check code coverage
      run: |
        coverage run -m unittest discover -s tests
        coverage report --fail-under=60
