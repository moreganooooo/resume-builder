[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
version = "0.1.0"
description = "Tailors a resume per job description using Gemini/Gemma, then renders it to PDF."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyyaml",
    "pydantic",
    "requests",
    "idna==3.15",
    "python-dotenv",
    "google-genai",
    "click",
    "rich",
    "linkedin-jobs-scraper",
    "selenium",
    "beautifulsoup4",
    "browser_cookie3",
    "questionary",
    "python-docx",
    "python-pptx",
    "pdfminer.six",
    "pypdf==6.15.0",
    "odfpy",
    "openpyxl",
]

# Kept in sync with requirements.txt by hand -- this is additive metadata
# for `uv tool install .` / `pipx install .` (B31), not a replacement for
# the venv dev flow requirements.txt still drives (see CLAUDE.md Setup).

[project.scripts]
resume = "scripts.cli:cli"

[tool.setuptools]
packages = ["scripts"]
