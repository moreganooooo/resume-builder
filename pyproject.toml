[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
version = "0.1.0"
description = "Tailors a resume per job description using Gemini/Gemma, then renders it to PDF."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyyaml",
    "pydantic",
    "requests",
    "idna==3.15",
    "python-dotenv",
    "google-generativeai",
    "click",
    "rich",
    "linkedin-jobs-scraper",
    "selenium",
    "beautifulsoup4",
    "browser_cookie3",
    "questionary",
    "python-docx",
    "python-pptx",
    "Pillow>=12.3.0",
    "pdfminer.six",
    "pypdf>=6.16.1",
    "odfpy",
    "openpyxl",
]

# Kept in sync with requirements.txt by hand -- this is additive metadata
# for `uv tool install .` / `pipx install .` (B31), not a replacement for
# the venv dev flow requirements.txt still drives (see CLAUDE.md Setup).

[project.scripts]
resume = "scripts.cli:cli"

[tool.setuptools]
packages = ["scripts"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["scripts"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["dashboard"]

[tool.pydocstyle]
match_dir = "scripts"
ignore = ["D100", "D104"]

[tool.coverage.run]
source = ["scripts", "tests"]
omit = ["*/site-packages/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 60
precision = 2

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "$version"

[tool.codespell]
skip = "*.json,*.csv,*.db,*.pyc,*.pycache,node_modules"
ignore-words-list = "datas,nd,sav"
