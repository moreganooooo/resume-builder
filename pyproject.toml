[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
version = "0.1.0"
description = "Tailors a resume per job description using Gemini/Gemma, then renders it to PDF."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyyaml",
    "pydantic",
    "requests",
    "idna==3.18",
    "python-dotenv",
    "google-generativeai",
    "click",
    "rich",
    "linkedin-jobs-scraper",
    "selenium",
    "beautifulsoup4",
    "questionary",
    "python-docx",
    "python-pptx",
    "Pillow>=12.3.0",
    "pdfminer.six",
    "pypdf>=6.16.1",
    "odfpy",
    "python-jobspy",
    "ddgs",
    "openpyxl",
]

# Kept in sync with requirements.txt by hand -- this is additive metadata
# for `uv tool install .` / `pipx install .` (B31), not a replacement for
# the venv dev flow requirements.txt still drives (see CLAUDE.md Setup).

[project.scripts]
resume = "scripts.cli:cli"

[tool.setuptools]
packages = ["scripts"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["scripts"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["dashboard"]

[tool.pyright]
# Pyright is not part of this project's checks -- mypy above is, and the
# pre-commit hooks are black/isort/bandit/yamllint/codespell. It runs only
# because an editor turns it on, and against this codebase it reports
# almost entirely false positives: scripts/ is imported via a sys.path
# insert rather than as a package (so every `import profile_paths` reads
# as unresolved), and pandas/questionary/rich stubs disagree with real
# runtime behaviour.
#
# Left at "off" rather than deleted so the setting is visible and
# reversible: turn it to "basic" if you ever want to work through the
# backlog deliberately, instead of having it narrate on every edit.
typeCheckingMode = "off"
reportMissingImports = "none"
extraPaths = ["scripts"]
exclude = ["dashboard", ".venv", "node_modules", "**/__pycache__", "**/.*"]

# NOTE: pydocstyle's real configuration lives in .pydocstyle, which takes
# precedence over this file. This block is kept only because it is what a
# reader looks for first, and it must not disagree with .pydocstyle -- it
# previously said `ignore = ["D100", "D104"]` while .pydocstyle ignored 50
# codes, so neither file described what actually ran. See .pydocstyle.
[tool.pydocstyle]
match_dir = "scripts"

[tool.coverage.run]
source = ["scripts", "tests"]
omit = ["*/site-packages/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 60
precision = 2

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "$version"

[tool.codespell]
# THIS IS THE SINGLE SOURCE OF TRUTH for codespell. .pre-commit-config.yaml
# used to carry its own --skip/--ignore-words-list copy of these settings,
# which drifted: a bare `codespell scripts tests` reported 35 findings the
# hook did not, so "clean under the hook" and "clean by hand" meant
# different things. The hook now passes no args and reads this block.
#
# content_filters.py is skipped because it carries German, Spanish,
# French and Portuguese function words as DATA, several of which
# codespell reads as misspelled English. Skipping the one file is
# narrower than adding them to ignore-words-list, where they would also
# mask real typos in English prose everywhere else.
skip = "*.json,*.csv,*.db,*.pyc,*.pycache,*.rtf,*.html,node_modules,scripts/content_filters.py"
# Every entry here is a word this codebase uses ON PURPOSE, not a typo
# being tolerated. Grouped by why:
#   spelling this codebase standardized on: unparseable (liveness.py's
#     own failure message, quoted verbatim in CLAUDE.md)
#   regex STEMS, deliberately truncated so they match inflections:
#     countr (eligible countr\w+), significan (statistically significan\w*),
#     ment (a suffix-stripping stemmer's literal), categor ("categor(ies)")
#   domain vocabulary: hsa/fsa (US Health Savings / Flexible Spending
#     Account, in compensation.py's benefit words that must NOT read as
#     salary), ehr (Electronic Health Records), coo (Chief Operating
#     Officer), bu (Business Unit), hims (the company Hims & Hers Health)
#   foreign-language data: ist (German, in liveness-core.mjs's
#     expired-posting patterns)
#   identifiers quoted in prose: alllocations (lever.mjs's allLocations)
#   pandas/stdlib vocabulary: datas, nd, sav
#   genuine dialect words in prose: cant, wit
ignore-words-list = "unparseable,ist,coo,ehr,cant,wit,bu,hims,countr,alllocations,ment,hsa,fsa,significan,categor,datas,nd,sav"
