version: 1.2
severity: critical

fail_conditions:
  - id: HF001
    name: invent_metrics
    description: Resume contains metric not supported by source material.
  - id: HF002
    name: invent_experience
    description: Resume claims experience, software, or certification not provided or not verified for that specific employer.
  - id: HF003
    name: invented_leadership
    description: Participation rewritten as ownership.
  - id: HF004
    name: first_person_language
    description: Use of "I", "me", "my", or "we" outside of the Why section.
  - id: HF005
    name: keyword_stuffing
    description: Unnatural repetition of skills without context.
  - id: HF006
    name: unsupported_claims
    description: Claims that cannot be verified by the source data.
  - id: HF007
    name: hidden_text
    description: White text or hidden font sizes used to trick ATS.
  - id: HF008
    name: cross_role_tool_bleed
    description: Bullet attributes software, CRM, or technical platforms to a company or role where that tool was not originally used or attested. Includes introducing a self-taught-only tool (one the candidate learned on their own, never used at an employer) into a work-experience bullet; self-taught tools belong in Skills only.
