version: 2.1

# Resume Design System — Style Rules
# Shared across all profiles; per-candidate specifics come from the ROLE RULES context block.

philosophy:
  - Decide professional identity before writing; every element must support that identity
  - Build around the future role, not the past career
  - Every bullet must pass the Who Cares test; if the hiring manager reason is not obvious, rewrite
  - Show systems not tasks; use frameworks/infrastructure/programs language not ran/wrote/handled
  - Metrics are king; adjectives are noise; replace excellent/outstanding with specific numbers
  - Strongest material first within each role; order by (1) JD-relevance (2) impressiveness (3) uniqueness
  - Mirror employer language for ATS; use exact JD phrasing across Summary Skills and bullets
  - Do not waste space on assumed soft skills; use space for scale technical depth and strategic ownership
  - Repeat real differentiators deliberately; identify this candidate's 2-3 most distinctive real skills/experiences (from their verified profile data) and repeat them across sections rather than diluting focus with generic breadth
  - Summary is positioning not biography; role/identity, area of specialization, value created — written pronoun-free, not third-person biography
  - Skills reinforce identity; lead with the archetype-relevant category not a tool dumping ground
  - Think like the hiring manager; dissolve their core anxieties through content selection
  - Bullet bank is LEGO not prose inspiration; start from curated verified bullets not net-new text
  - Relevance beats impressiveness; cut impressive-but-irrelevant before relevant-but-modest
  - Optimize for one reaction: She is exactly the kind of person we need

writing_style:
  preferred:
    - concise
    - specific
    - factual
    - direct
    - systems_language_over_task_language
    - mirror_jd_vocabulary_for_ats
    - preserve_candidate_voice
  avoid:
    - hype
    - buzzwords
    - marketing_language
    - consultant_speak
    - adjective_padding
    - soft_skill_filler
    - passive_voice

bullet_structure:
  pattern: "Strong past-tense action verb → task/responsibility → result/outcome (with metric if verified)"
  fallback: "Action verb → task/responsibility"
  one_liner_target_chars: 110
  one_liner_max_chars: 120
  two_liner_max_chars: 220
  mix: "~70% one-liners, ~30% two-liners"
  max_printed_lines: 2
  widow_rule: "Never wrap to a second line with fewer than 5 words"
  widow_min_words: 5

verb_rules:
  - Open every bullet with a strong specific past-tense action verb
  - Present tense only for actively held roles
  - Each opening verb must be UNIQUE across the entire CV; no verb may open more than one bullet
  - A strong verb is self-sufficient — it does not need an adverb or adjective to complete its meaning
  - If you find yourself writing "developed effectively" or "managed successfully", the verb is weak; replace it with one precise verb
  - Never flag a weak verb without also providing the replacement; the rewrite must fix it, not just note it
  - Recommended verbs: Architected, Authored, Launched, Recovered, Systematized, Audited, Spearheaded,
      Negotiated, Synthesized, Produced, Streamlined, Championed, Deployed, Expanded,
      Coordinated, Mentored, Built, Implemented, Founded, Delivered, Drove, Engineered, Established,
      Executed, Generated, Identified, Led, Managed, Orchestrated, Overhauled, Piloted, Redesigned,
      Reduced, Secured, Trained, Unified

# Vague verbs — these trigger a weak-verb flag during critique scoring.
# When one of these opens a bullet, the rewrite model MUST replace it using
# the verb_upgrades table below. Do not leave the vague verb in place.
vague_verbs:
  - developed      # too broad; does not signal whether built/designed/launched/wrote
  - worked on      # task language, not ownership language
  - handled        # passive; implies assignment not initiative
  - helped         # supporting role framing; loses credit
  - assisted       # same as helped
  - supported      # same pattern; dilutes ownership
  - did            # non-specific; always replaceable
  - made           # vague noun-hiding verb ("made a plan" → "planned")
  - got            # vague acquisition verb
  - created        # overused and hollow without context; upgrade to the specific creative act
  - utilized       # bureaucratic; replace with the direct verb ("used" is fine; specific is better)
  - leveraged      # consultant-speak; replace with the actual action
  - facilitated    # weakens ownership; use "led", "ran", "taught", "moderated"
  - was responsible for   # forbidden opener (see forbidden_openers)
  - oversaw        # management-speak; use "directed", "supervised", "led"
  - participated in       # spectator framing; always replaceable
  - contributed to        # credit-sharing framing; find what she specifically owned
  - involved in           # passive; rewrite to show active ownership

# Verb upgrade swap table — domain-organized replacements for vague verbs.
# Format: vague opening → stronger alternatives relevant to Morgan's work.
# Rule: pick the upgrade that most precisely names the actual action performed.
# When in doubt, use the noun in the sentence as a clue ("made a plan" → "planned").
verb_upgrades:

  data_and_ops:
    description: "CRM hygiene, reporting, systems administration, process ops"
    upgrades:
      - weak: "developed [a process/system/workflow]"
        strong: [Engineered, Architected, Systematized, Standardized, Overhauled, Built]
      - weak: "managed [accounts/records/data]"
        strong: [Administered, Audited, Migrated, Reconciled, Maintained, Governed]
      - weak: "worked on [Salesforce/CRM/reporting]"
        strong: [Administered, Configured, Implemented, Owned, Deployed]
      - weak: "created [reports/dashboards]"
        strong: [Built, Designed, Engineered, Produced, Automated]
      - weak: "handled [data/records/tickets]"
        strong: [Audited, Reconciled, Triaged, Processed, Resolved]

  content_and_comms:
    description: "Writing, email, newsletters, campaigns, copy, social"
    upgrades:
      - weak: "developed [content/copy/campaign]"
        strong: [Authored, Produced, Drafted, Crafted, Launched, Wrote]
      - weak: "created [content/assets/materials]"
        strong: [Produced, Authored, Designed, Built, Packaged]
      - weak: "worked on [campaigns/emails/copy]"
        strong: [Executed, Launched, Managed, Ran, Owned]
      - weak: "managed [email/social/newsletter]"
        strong: [Owned, Ran, Orchestrated, Directed, Launched]
      - weak: "helped [with messaging/copy/communications]"
        strong: [Wrote, Authored, Edited, Shaped, Drafted]

  training_and_enablement:
    description: "Onboarding, training docs, facilitation, coaching, LMS"
    upgrades:
      - weak: "developed [training/curriculum/materials]"
        strong: [Designed, Built, Authored, Produced, Systematized]
      - weak: "facilitated [training/workshops/sessions]"
        strong: [Led, Taught, Ran, Delivered, Coached]
      - weak: "helped [train/onboard/coach]"
        strong: [Trained, Onboarded, Coached, Mentored, Guided]
      - weak: "created [onboarding docs/playbooks/guides]"
        strong: [Built, Authored, Designed, Produced, Standardized]
      - weak: "worked on [enablement/training programs]"
        strong: [Designed, Built, Ran, Owned, Launched]

  project_delivery:
    description: "Coordinating, executing, launching, delivering projects"
    upgrades:
      - weak: "managed [a project/initiative/rollout]"
        strong: [Led, Directed, Orchestrated, Spearheaded, Executed, Delivered]
      - weak: "worked on [a project/launch/initiative]"
        strong: [Executed, Delivered, Led, Piloted, Drove]
      - weak: "helped [launch/roll out/coordinate]"
        strong: [Launched, Coordinated, Executed, Delivered, Supported → (reframe to specific ownership)]
      - weak: "oversaw [a project/team/process]"
        strong: [Directed, Led, Supervised, Managed, Owned]
      - weak: "participated in [a project/committee/initiative]"
        strong: [(find what she specifically owned or contributed → name that thing directly)]

  systems_and_tech:
    description: "Tool implementation, integrations, admin, automation"
    upgrades:
      - weak: "developed [a tool/integration/system]"
        strong: [Engineered, Architected, Built, Implemented, Deployed, Configured]
      - weak: "utilized [Salesforce/Outreach/HubSpot/tools]"
        strong: [Administered, Configured, Deployed, Implemented, Operated]
      - weak: "leveraged [technology/tools/data]"
        strong: [(replace with the specific action: Queried, Automated, Configured, Extracted, Analyzed)]
      - weak: "created [automations/workflows/sequences]"
        strong: [Built, Engineered, Designed, Automated, Deployed]
      - weak: "worked on [implementation/integration/setup]"
        strong: [Implemented, Configured, Deployed, Integrated, Launched]

forbidden_openers:
  - responsible for
  - helped with
  - worked on
  - assisted with
  - participated in

forbidden_phrases:
  - results-driven
  - results-driven professional
  - results-oriented
  - dynamic professional
  - self-starter
  - go-getter
  - thought leader
  - visionary
  - visionary leader
  - synergized
  - synergy
  - synergies
  - best-in-class
  - passionate
  - passionate professional
  - driven professional
  - seeking opportunities
  - proven track record
  - detail-oriented
  - detail-oriented professional
  - team player
  - accomplished professional
  - highly motivated
  - highly motivated professional
  - dedicated professional
  - seasoned professional
  - strategic thinker
  - innovative thinker
  - hard worker
  - fast learner
  - excellent communication skills
  - demonstrated success
  - thrives in fast-paced environments
  - world-class
  - cutting-edge
  - wear many hats
  - to whom it may concern

# "leverage"/"leverage technology"/"utilized" were removed from the hard-gate
# forbidden_phrases list above -- unlike the cliches above them, these are
# real verbs that can be the clearest, most specific way to describe actual
# tool usage ("Leveraged Claude to draft email copy" is concrete, not empty
# filler). A hard gate can't tell "lazy filler" from "accurate and specific"
# apart; that judgment call is better left to vague_verbs below (a softer,
# advisory upgrade nudge the critique/rewrite steps weigh against everything
# else) rather than an unconditional validator rejection.

punctuation_rules:
  - Bullets never end with periods or any trailing punctuation
  - No parentheses in bullets or Summary; replace with commas or semicolons
  - No dashes in prose; dashes allowed only in date ranges or hyphenated modifiers
  - No bold text inside bullet content
  - Use en-dash for date ranges (08/2016 – 08/2024)
  - Dates always numeric (08/2016 not August 2016)
  - Ampersand usage: use & in headings/labels/tagline/category names; use and in body prose and bullets

metrics_rules:
  - Every numeric metric appears at most ONCE across the entire CV
  - If a metric is in the Summary it must not repeat in bullets
  - No unsourced metrics; every number must be traceable to verified-claims.csv or extracted-screenshot-metrics.csv
  - Cautious language for marginally noisy metrics: among our highest-performing sequences not absolute superlatives
  - Number formatting:
      spell_out_under_10: true  # except when tied to a unit/metric
      always_numeral: [percentages, dollar figures, decimals, quantities over 10, date ranges]
      dollar_format: "$3M, $1.1M" # not $3,000,000

pronoun_rules:
  allowed_in: [why_section_only]
  forbidden_in: [summary, skills, work_experience, training, education]

tool_mention_rules:
  per_bullet_ideal: 1
  per_bullet_max: 2
  per_bullet_hard_limit: 3  # 3+ reads as a list not a narrative

tagline:
  # Empirically measured (Playwright, real DM Sans 14pt rendering at
  # the actual 7.5in content width): realistic uppercase taglines run
  # ~0.117-0.119in/char, so even a 65-char tagline can wrap to a 2nd line.
  # A prior "target 70-80 characters" guess was simply wrong.
  max_chars: 60

skills_section:
  position: immediately_after_summary
  importance: highest_ats_signal
  line_max_chars: 110  # including category label and commas; wrapping to a 2nd line is fine as long as it doesn't leave a short widow
  widow_min_chars: 25  # a 2nd-line remainder shorter than this looks like a stray scrap, not an intentional wrap
  separator: ", "  # comma + space; no bullets or pipes inside a category
  label_style: bold  # via .skill-category class
  casing: title_case  # every category label and item is Title Case, even when mirroring a JD term that's written lowercase/sentence-case (e.g. JD's "CMS platforms" -> "CMS Platforms")
  archetype_ordering:
    lifecycle: [Lifecycle/Retention Marketing, CRM/Revenue Operations, Content/Enablement/Training, Creative/Design]
    copywriter: [Content & Communications Strategy, Writing & Editing, CRM/Analytics, Creative]
    enablement: [Sales Enablement, Content Systems, CRM/Revenue Operations, Training/Facilitation]
    marketing_ops: [CRM/Revenue Operations, Marketing Automation, Reporting/Analytics, Content/Strategy]
  category_name_upgrades:
    - Use "Salesforce Administration" not "Salesforce" to signal admin-level depth
    - Use "Revenue Operations" not "Marketing Operations" where appropriate
    - Use "Lifecycle Strategy" not "Lifecycle Campaign Design"

ats_rules:
  - Single column only; no sidebars or multi-column layout
  - Standard section headers only: Professional Summary, Skills, Work Experience, Training & Certifications, Education
  - No text inside images or SVGs
  - No critical content in PDF headers or footers
  - No nested tables
  - UTF-8 text only with ATS-safe punctuation; no exotic symbols

layout_rules:
  page_count: exactly 2 pages
  page_size: Letter (8.5 x 11 in) for US/Canada; A4 for explicitly international roles
  margins: 0.5in all sides
  content_width: 7.5in
  page_1: [Header, Professional Summary, Skills, Work Experience (page-1 roles per this candidate's ROLE RULES)]
  page_2: [Work Experience continued (page-2 roles per this candidate's ROLE RULES), Training & Certifications, Education, Why section if present]
  # Why is the first thing trimmed, not the last resort: it only belongs on
  # the resume if it fits without pushing the page count past 2.
  trimming_priority:
    1: Remove Why section entirely
    2: Trim Summary to 5-line limit
    3: Tighten bullets (trim adjectives, front-load keywords, collapse redundant clauses)
    4: Remove least-relevant bullets from the lowest flex-priority role first (protect this candidate's Protected Bullets list)

typography:
  name_font: DM Serif Display 400 32pt
  section_headers_font: DM Serif Display 400 16pt
  body_font: DM Sans 400/600
  tagline_size: 14pt
  body_size: 10.5pt
  contact_size: 9.75pt
  prohibited_fonts: [Inter]  # Chromium/Playwright reversed-text bug
  color_text: "#000000"
  color_rules: "#9aa3af"  # horizontal rules and separators only; no gradients or accent colors
  color_background: "#ffffff"
  tagline_case: HARD-CODED UPPERCASE in HTML string (not CSS text-transform)
