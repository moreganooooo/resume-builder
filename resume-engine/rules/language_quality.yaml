# --------------------------------------------------
# HIGH-RISK BUZZWORDS
# --------------------------------------------------

buzzwords:

  high_risk:

    - results-driven
    - dynamic professional
    - highly motivated
    - seasoned professional
    - passionate professional
    - proven track record
    - innovative thinker
    - strategic thinker
    - self-starter
    - go-getter
    - team player
    - hard worker
    - fast learner
    - detail-oriented professional
    - excellent communication skills
    - demonstrated success
    - thrives in fast-paced environments
    - world-class
    - best-in-class
    - cutting-edge
    - thought leader
    - synergy
    - synergies
    - leverage
    - utilized

  medium_risk:

    - various
    - several
    - multiple
    - numerous
    - stakeholders
    - cross-functional
    - end-to-end ownership

# --------------------------------------------------
# GENERIC CLAIMS
# --------------------------------------------------

generic_claims:

  - strong communication skills
  - excellent interpersonal skills
  - problem solver
  - proven leader
  - strategic mindset
  - innovative professional
  - customer-focused professional
  - highly organized
  - dedicated professional
  - driven individual

# --------------------------------------------------
# REPLACEMENT RULES
# --------------------------------------------------

replacement_rules:

  results_driven:

    reject:
      - results-driven

    require:
      - actual_result
      - actual_metric

  strategic_thinker:

    reject:
      - strategic thinker

    require:
      - strategy_description

  innovative:

    reject:
      - innovative

    require:
      - innovation_example

  team_player:

    reject:
      - team player

    require:
      - collaboration_example

# --------------------------------------------------
# AI LANGUAGE DETECTION
# --------------------------------------------------

ai_language_patterns:

  severe:

    - results-driven professional
    - highly motivated professional
    - seasoned professional
    - dynamic professional
    - proven track record
    - passionate professional
    - utilized
    - leverage technology

  moderate:

    - cross-functional collaboration
    - stakeholder engagement
    - end-to-end ownership
    - strategic initiatives
    - business objectives
    - leverage technology

  low:

    - various
    - multiple
    - several

# --------------------------------------------------
# SPECIFICITY CHECKS
# --------------------------------------------------

specificity_checks:

  flag_if_contains:

    - various
    - several
    - many
    - multiple
    - numerous

  recommendation:
    Replace vague quantities with specific counts,
    metrics, projects, teams, or outcomes.

# --------------------------------------------------
# VERB SCORING
# --------------------------------------------------

verb_scoring:

  elite:
    score: 100

  strong:
    score: 85

  acceptable:
    score: 70

  weak:
    score: 40

  generic:
    score: 20

# --------------------------------------------------
# FINAL LANGUAGE TEST
# --------------------------------------------------

manager_test:

  question:
    Could a hiring manager ask "How exactly did you do this?"
    and receive a believable answer?

  pass:
    Specific action + evidence + outcome

  fail:
    Generic claim + buzzword + no proof

final_principle:

  Evidence beats adjectives.
  Specificity beats sophistication.
  Proof beats personality.