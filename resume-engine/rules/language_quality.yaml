version: 1.0

section: language_quality

description: >
  Evaluates language quality, action verbs, buzzwords,
  AI-generated phrasing, specificity, and evidence-driven writing.

# --------------------------------------------------
# WEAK VERBS
# --------------------------------------------------

weak_verbs:

  helped:
    severity: medium

    preferred:

      - coordinated
      - executed
      - enabled
      - improved
      - implemented
      - streamlined
      - optimized

  worked_on:
    severity: medium

    preferred:

      - designed
      - built
      - launched
      - executed
      - implemented

  responsible_for:
    severity: high

    preferred:

      - managed
      - administered
      - directed
      - coordinated
      - owned

  handled:
    severity: medium

    preferred:

      - managed
      - resolved
      - executed
      - administered
      - coordinated

  assisted:
    severity: medium

    preferred:

      - contributed_to
      - coordinated
      - executed

  participated_in:
    severity: medium

    preferred:

      - contributed_to
      - collaborated_on
      - executed

  used:
    severity: medium

    preferred:

      - administered
      - configured
      - applied
      - implemented
      - optimized

  made:
    severity: low

    preferred:

      - generated
      - produced
      - designed

  did:
    severity: high

    preferred:

      - rewrite_required

