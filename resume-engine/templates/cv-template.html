<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morgan Escott — Resume</title>
<style>
  @font-face {
    font-family: 'DM Serif Display';
    src: url('./fonts/dm-serif-display-latin.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  @font-face {
    font-family: 'DM Serif Display';
    src: url('./fonts/dm-serif-display-latin-ext.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  /*
    Static instances, not the raw variable font: Chromium's print-to-PDF path
    re-derives a font resource per distinct (size, weight) combination out of
    a variable font, which multiplied into dozens of near-duplicate Type3
    subsets in the exported PDF and coincided with garbled copy-pasted text
    (visually correct, but the underlying text layer came out scrambled).
    Baking fixed Regular/ExtraBold/Italic instances with fonttools'
    varLib.instancer removes that code path entirely.
  */
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/DMSans-Regular-static.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/DMSans-ExtraBold-static.ttf') format('truetype');
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/DMSans-Italic-static.ttf') format('truetype');
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 9.75pt;
    font-weight: 400;
    line-height: 1.2;
    color: #000000;
    background: #ffffff;
    padding: 0;
    margin: 0;
    /* text-wrap is inherited, so setting it once here applies resume-wide
       (Skills, bullets, Summary, Why, Education) rather than per-section.
       Chromium's line-balancing reduces short widow lines when text wraps --
       doesn't guarantee zero widows (a real post-render layout check would
       be needed for that), but it's a free, safe improvement everywhere. */
    text-wrap: pretty;
    /* Ligatures OFF, deliberately. DM Sans renders "fi"/"fl" as single glyphs
       (U+FB01/U+FB02); PyMuPDF silently expands those back, but pypdf and
       pdfminer -- what real ATS stacks are built on -- extract them verbatim,
       so "Certification" arrives as "Certiﬁcation" and stops matching the
       keyword. Cosmetically invisible, functionally fatal. Never remove. */
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0;
  }

  .page {
    width: 100%;
    max-width: 8.5in;
    margin: 0 auto;
    padding: 0;
  }

  /* === HEADER === */
  .header {
    margin-bottom: 12px;
  }

  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 36pt;
    font-weight: 400;
    color: #000000;
    line-height: 0.5625in;
    margin-bottom: 1px;
  }

  /* Tagline: DM Sans 15pt, hard-coded uppercase in the data string. See
     style_rules.yaml's tagline.max_chars for the char budget this size
     implies -- it's scaled from this size, so the two must move together. */
  .header-tagline {
    font-family: 'DM Sans', sans-serif;
    font-size: 15pt;
    font-weight: 400;
    color: #000000;
    line-height: 0.268in;
    margin-bottom: 3px;
  }

  /* Tagline's "|" separator is wrapped in this span by render_html.py's
     _wrap_tagline_pipe */
  .tagline-sep {
    color: #000000;
    padding: 0 4px;
  }

  .contact-row {
    font-family: 'DM Sans', sans-serif;
    font-size: 9.75pt;
    font-weight: 400;
    line-height: 1;
    color: #000000;
  }

  .contact-row .separator {
    color: #9aa3af;
    padding: 0 4px;
  }

  /* === SECTIONS === */
  .section {
    margin-bottom: 10px;
  }

  /* Section titles: DM Serif Display 16pt — matches design system spec */
  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16pt;
    font-weight: 400;
    color: #000000;
    border-bottom: 0.018cm solid #9aa3af;
    padding-bottom: 2px;
    margin-bottom: 3px;
    line-height: 1.2;
  }

  /* === PROFESSIONAL SUMMARY === */
  .summary-text {
    font-size: 9.75pt;
    line-height: 1.2;
    color: #000000;
  }

  .summary-text strong {
    font-weight: 800;
  }

  /* === SKILLS ===
     Rendered by render_pdf as:
       <div class="skills-grid"><span class="skill-item">…</span>…</div>
     Each category is its own line -- no pipe separators between them
     (a pipe-joined single flow read as stray "|" characters at line wraps). */
  .skills-grid {
    display: flex;
    flex-direction: column;
    gap: 1px;
    font-size: 9.75pt;
    line-height: 1.2;
    color: #000000;
  }

  .skill-item {
    font-family: 'DM Sans', sans-serif;
    font-size: 9.75pt;
    font-weight: 400;
    color: #000000;
  }

  /* Legacy fallback: .skills-text used by any cached JSON rendered before this
     commit. Styled identically to .skills-grid so old outputs still look right. */
  .skills-text {
    font-size: 9.75pt;
    line-height: 1.2;
    color: #000000;
  }

  /* Category label is rendered as a bare <strong> inside .skill-item (see
     render_html.py's build_skills_html) -- targeting it directly here,
     rather than an unused .skill-category class, so the weight below is
     actually applied instead of falling back to the browser's default
     bold. */
  .skill-item strong {
    font-weight: 800;
  }

  /* === WORK EXPERIENCE === */
  .job {
    margin-bottom: 10px;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Job title comes first (bold) -- role plus industry/type descriptor. */
  .job-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 9.75pt;
    font-weight: 800;
    color: #000000;
  }

  /* Job meta comes second (bold, one line): company, size/revenue,
     location or work type, then dates -- all pipe-separated. Thin rule
     underneath separates company info from the career note/bullets below. */
  .job-meta {
    font-size: 9.75pt;
    font-weight: 800;
    color: #000000;
    margin-bottom: 3px;
    border-bottom: 0.018cm solid #9aa3af;
  }

  .job-meta .sep {
    color: #9aa3af;
    padding: 0 4px;
  }

  /* Clients: optional roster line (bold label, regular list), between the
     job-meta divider and the bullets. Present for VML/Callahan Creek
     (always). */
  .job-clients {
    font-size: 9.75pt;
    font-weight: 400;
    color: #000000;
    margin-top: 3px;
  }

  .job-clients strong {
    font-weight: 800;
  }

  /* Career note: optional one-sentence italic note (Treering only) */
  .career-note {
    font-size: 9.75pt;
    font-style: italic;
    color: #000000;
    margin-top: 4px;
    margin-bottom: 3px;
    line-height: 1.2;
  }

  /* "Career Note:" label -- matches the other 800-weight headings
     (.job-title, .cert-title, .skill-item strong, etc.) instead of falling
     back to the browser's default bold. */
  .career-note strong {
    font-weight: 800;
    font-style: normal;
  }

  .job ul {
    padding-left: 16px;
    margin-top: 3px;
  }

  .job li {
    font-size: 9.75pt;
    line-height: 1.2;
    color: #000000;
    margin-bottom: 1px;
  }

  /* No bold inside bullets per design system */
  .job li strong { font-weight: 400; }

  /* === CERTIFICATIONS ===
     Single pipe-separated line per entry: Title | Org | Year */
  .cert-item {
    margin-bottom: 1px;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .cert-title {
    font-size: 9.75pt;
    font-weight: 800;
    color: #000000;
  }

  .cert-sep {
    color: #9aa3af;
    padding: 0 4px;
  }

  .cert-org {
    font-size: 9.75pt;
    font-weight: 400;
    color: #000000;
  }

  .cert-year {
    font-size: 9.75pt;
    font-weight: 400;
    color: #000000;
  }

  /* === EDUCATION ===
     Single line per entry, mirroring .cert-item: degree (bold) followed by
     institution/location/year (regular weight), pipe-separated -- saves a
     line per entry versus the two-line .job-title/.job-meta split. */
  .edu-item {
    margin-bottom: 6px;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .edu-header {
    font-size: 9.75pt;
    margin-bottom: 3px;
    border-bottom: 0.018cm solid #9aa3af;
  }

  .edu-title {
    font-weight: 800;
    font-size: 9.75pt;
    color: #000000;
  }

  .edu-meta-text {
    font-size: 9.75pt;
    font-weight: 800;
    color: #000000;
  }

  .edu-header .sep {
    color: #9aa3af;
    padding: 0 4px;
  }

  .edu-desc {
    font-size: 9.75pt;
    color: #000000;
    margin-top: 2px;
    line-height: 1.2;
  }

  /* Education bullets */
  .edu-item ul {
    padding-left: 16px;
    margin-top: 3px;
  }

  .edu-item li {
    font-size: 9.75pt;
    line-height: 1.2;
    color: #000000;
    margin-bottom: 1px;
  }

  /* === WHY SECTION === */
  .why-text {
    font-size: 9.75pt;
    line-height: 1.2;
    color: #000000;
  }

  .why-text p {
    margin-bottom: 8px;
  }

  .why-text p:last-child {
    margin-bottom: 0;
  }

  /* Links never break across lines */
  a { white-space: nowrap; }

  /* === PAGE BREAK CONTROL ===
     .job, .edu-item, .cert-item each carry break-inside: avoid
     in their own rules above. .avoid-break is kept as a general utility
     class for header and small single-block sections. */
  .avoid-break {
    break-inside: avoid;
    page-break-inside: avoid;
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header avoid-break">
    <h1>{{NAME}}</h1>
    <div class="header-tagline">{{TAGLINE}}</div>
    <div class="contact-row">
      <span>{{PHONE}}</span>
      <span class="separator">|</span>
      <span>{{EMAIL}}</span>
      <span class="separator">|</span>
      <span>{{LINKEDIN_DISPLAY}}</span>
      <span class="separator">|</span>
      <span>{{LOCATION}}</span>
    </div>
  </div>

  <!-- PROFESSIONAL SUMMARY -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_SUMMARY}}</div>
    <div class="summary-text">{{SUMMARY_TEXT}}</div>
  </div>

  <!-- SKILLS (immediately after Summary — highest ATS signal) -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_SKILLS}}</div>
    {{SKILLS}}
  </div>

  <!-- WORK EXPERIENCE -->
  <div class="section">
    <div class="section-title">{{SECTION_EXPERIENCE}}</div>
    {{EXPERIENCE}}
  </div>

  <!-- TRAINING & CERTIFICATIONS -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_CERTIFICATIONS}}</div>
    {{CERTIFICATIONS}}
  </div>

  <!-- EDUCATION -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_EDUCATION}}</div>
    {{EDUCATION}}
  </div>

  <!-- WHY [COMPANY]? (conditional -- render_html.py drops this entirely when WHY_TEXT is blank) -->
  {{WHY_SECTION}}

</div>
</body>
</html>
