# =========================================================
# -- Reporting --
# =========================================================
reporting:
  track_source_counts: true
  track_source_category_counts: true
  min_results_to_report: 1
  output_source_column: true
  alert_on_zero_sources:
    - greenhouse-sweep
    - ashby-sweep
    - lever-sweep
    - workday-sweep

# =========================================================
# -- Search queries --
# PHILOSOPHY: Wide categorical net. title_filter handles precision.
# To avoid the 32-term limit, heavy job boards are split into two parallel sweeps.
# Updated 2026-06-04: synced all keyword groups to full positive title filter.
#   Marketing & Enablement sweep: +10 terms
#     (writer, editorial, narrative, messaging, storytell, instructional,
#      outreach, donor, GTM, readiness)
#   Onboarding & Success sweep: +6 terms
#     (nurture, journey, launch, activation, experience, relationship)
# Updated 2026-06-05: +source_tag, +source_category on every entry
# Updated 2026-06-05 (audit): removed -engineer -developer from all ATS sweep queries
# =========================================================
search_queries:

  # ATS Platform Sweeps
  - name: "Greenhouse — Onboarding & Implementation Sweep"
    query: "(site:boards.greenhouse.io OR site:job-boards.greenhouse.io) (onboarding OR implementation OR \"customer success\" OR \"client services\" OR \"solutions consultant\" OR training OR education OR enablement OR engagement OR adoption OR nurture OR journey OR launch OR activation OR experience OR relationship) remote -recruiter"
    enabled: true
    source_tag: greenhouse-sweep
    source_category: ats_sweep
  
  - name: "Greenhouse — Marketing & Enablement remote"
    query: "(site:boards.greenhouse.io OR site:job-boards.greenhouse.io) (marketing OR lifecycle OR campaign OR email OR CRM OR content OR communications OR enablement OR retention OR training OR engagement OR copywriting OR writer OR editorial OR narrative OR messaging OR storytell OR instructional OR outreach OR donor OR GTM OR readiness) remote -recruiter"
