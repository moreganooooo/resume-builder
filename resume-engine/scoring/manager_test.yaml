version: 2.0
# Active -- primary rubric for critique_resume.md.
# Expanded from v1.1 to align with the Morgan Escott Design System and style_rules.yaml.

# The Manager Test simulates a hiring manager asking the hardest questions
# about a bullet before it reaches the resume.
# A bullet must be able to defend itself against every question below.

questions:
  - What exactly did they do?
  - How did they do it?
  - What tools or systems were involved?
  - What was the scale or scope?
  - What challenges or constraints existed?
  - What was the measurable outcome?
  - Could this claim be verified in a reference call?

pass_conditions:
  minimum_confidence: 80
  # A bullet passes if it can answer at least 4 of the 7 questions above
  # and scores >= 80 on confidence.
  minimum_questions_answered: 4

reject_if:
  score_below: 60
  any_hard_fail: true   # any single hard_fail condition below triggers immediate rejection

# Hard fails — any one of these alone rejects the bullet regardless of score
hard_fail_conditions:
  - vague_action           # verb gives no indication of what was actually done
  - unexplained_metric     # a number appears with no context for what it measures
  - unclear_scope          # no indication of scale, team size, time frame, or volume
  - generic_language       # could describe any marketing professional anywhere
  - unverifiable_claim     # no plausible way to confirm in a reference check
  - scope_inflation        # claims credit for outcomes beyond individual contribution
  - hallucination_risk     # system flag: no matching evidence found in bullet bank

# Soft fails — these reduce score but do not auto-reject
soft_fail_conditions:
  - only_one_question_answered: -20
  - no_tool_mentioned_when_expected: -10   # e.g., CRM bullet with no Salesforce reference
  - metric_missing_but_estimable: -10      # outcome described qualitatively when a metric exists
  - passive_construction: -10              # "was responsible for" style phrasing
  - opener_on_banned_list: -15             # matches banned_openers in ai_risk.yaml

# Scoring rubric
scoring:
  action_clarity:
    description: "Is it clear what the candidate specifically did?"
    weight: 25
  tool_or_method:
    description: "Is the tool, platform, or method named?"
    weight: 20
  outcome:
    description: "Is there a measurable or observable result?"
    weight: 25
  scope:
    description: "Is the scale, size, or context established?"
    weight: 15
  verifiability:
    description: "Could a reference confirm this claim?"
    weight: 15

# Protected bullets — these pass automatically and must never be shortened or rewritten
# without explicit user approval. Confirm evidence source before any edit.
protected_bullets:
  - "Identified $3M in untapped pipeline"
  - "Outreach.io platform ownership"
  - "CRM scrub of 2,900+ accounts"
  - "Content Committee"
  - "SDR Process Map"
