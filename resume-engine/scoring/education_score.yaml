version: 1.0

section: education

max_score: 100

weights:

  completeness: 40
  formatting_consistency: 20
  relevance: 10
  appropriateness_for_experience_level: 30

required_fields:

  - institution
  - degree_or_program

optional_fields:

  - graduation_year
  - honors
  - certifications

scoring_rules:

  completeness:

    excellent:
      - institution_present
      - degree_present

    poor:
      - missing_degree
      - incomplete_school_name

  formatting_consistency:

    excellent:
      - consistent_dates
      - consistent_capitalization

    poor:
      - mixed_formats
      - inconsistent_spacing

  appropriateness:

    experienced_candidates:

      preferred:
        - concise

      penalties:
        - excessive_detail
        - oversized_education_section

    early_career_candidates:

      preferred:
        - coursework
        - honors
        - projects

red_flags:

  - education_dominates_resume
  - excessive_coursework_for_senior_candidate
  - irrelevant_detail

flags:

  incomplete_education
  inconsistent_formatting
  excessive_education_emphasis