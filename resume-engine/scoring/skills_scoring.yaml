version: 2.0

section: skills

max_score: 100

weights:

  relevance: 40
  logical_grouping: 25
  evidence_support: 20
  no_redundancy: 15

required_rules:

  - skills_must_be_grouped
  - skills_must_be_relevant
  - skills_should_be_supported_by_experience

