# scoring/ats_match.yaml
# Defines the mathematical weights for comparing candidate resume vs. target job description.

match_weights:
  exact_match: 1.0    # e.g., JD asks for "Python", resume says "Python"
  semantic_match: 0.7 # e.g., JD asks for "Data Visualization", resume says "Tableau"
  partial_match: 0.4  # e.g., JD asks for "Salesforce Administration", resume says "Salesforce User"

section_multipliers:
  recent_experience: 1.2 # Skills used in the last 3 years carry more weight
  older_experience: 0.8  # Skills used 4+ years ago
  skills_section: 1.0    # Baseline weight
  summary_section: 0.5   # Lowest weight; telling, not showing

thresholds:
  excellent_match: 85 # Ready to apply
  good_match: 70      # Needs tailoring
  weak_match: 50      # Missing core competencies

hard_requirements:
  penalty: -25 # Point deduction if a skill marked "Required" in JD is entirely missing

# Per-archetype overrides of match_weights/section_multipliers above, keyed to the
# archetype names in profile.yml's archetypes list. Not derived from data -- a first-pass
# guess at which match type should carry more weight for each archetype's kind of work.
# Tune these based on what critique_resume.md actually flags over time. An archetype not
# listed here just uses the top-level defaults.
archetype_overrides:
  "Lifecycle Marketing Specialist":
    exact_match: 1.0
    semantic_match: 0.6   # tool-specific work; less credit for "similar enough" tools
    partial_match: 0.4
    section_multipliers:
      recent_experience: 1.3 # ESP/CRM tooling changes fast; recency matters more here

  "Customer Onboarding & Implementation Specialist":
    exact_match: 1.0
    semantic_match: 0.6
    partial_match: 0.4
    section_multipliers:
      recent_experience: 1.3

  "Sales Enablement Specialist":
    exact_match: 0.9
    semantic_match: 0.85  # playbook/training/voice-governance reads as competence, not tool-name hits
    partial_match: 0.5

  "B2B Content Strategist":
    exact_match: 0.8
    semantic_match: 0.9   # writing quality and voice matter more than exact tool-keyword hits
    partial_match: 0.5

  "Customer Marketing Manager":
    exact_match: 0.9
    semantic_match: 0.75
    partial_match: 0.45

# Per-platform overrides of match_weights above, keyed to the ATS platforms
# scan_ats.py already tracks live job postings from (board-scanners/providers/,
# see that file's own docstring). Same disclaimer as archetype_overrides: not
# derived from this candidate's own outcome data, a first-pass guess grounded
# in each platform's known reputation among ATS-optimization practitioners --
# legacy enterprise ATS (Workday, Taleo, iCIMS) lean on strict exact-phrase
# matching with weak synonym/semantic credit; modern ATS built for tech/
# startup hiring (Greenhouse, Lever) do noticeably better semantic matching.
# Used by critique_resume.md Step 6 to identify the resume's single weakest
# platform and any concrete parsing risks, not to compute five separate
# numeric scores -- a platform's real behavior (section-header sensitivity,
# acronym handling) isn't fully captured by three multipliers, so
# parsing_notes carries the part a raw weight can't.
platform_overrides:
  "Workday":
    exact_match: 1.0
    semantic_match: 0.4
    partial_match: 0.3
    parsing_notes: >
      Strict exact-phrase keyword matching, weak synonym credit. Rewards
      standard section headers (this template's "Work Experience"/"Skills"/
      "Education" already match Workday's expectations) and spelling out an
      acronym alongside its expansion at least once (e.g. "customer
      relationship management (CRM)") rather than relying on the acronym
      alone.

  "Taleo":
    exact_match: 1.0
    semantic_match: 0.3
    partial_match: 0.25
    parsing_notes: >
      One of the weakest semantic engines still in wide enterprise use --
      near-pure keyword density scoring. A JD requirement paraphrased
      instead of quoted near-verbatim gets little to no credit here, more
      than on any other platform in this list.

  "iCIMS":
    exact_match: 1.0
    semantic_match: 0.5
    partial_match: 0.35
    parsing_notes: >
      Mid-tier: better than Taleo's synonym handling but still keyword-
      driven. Multi-word tool/platform names split awkwardly across a line
      break are a known real risk here specifically (see
      validate_pdf_text.py's line-break tolerance -- that check protects
      the PDF's own text layer, not what iCIMS's own re-parsing of it does).

  "Greenhouse":
    exact_match: 0.9
    semantic_match: 0.75
    partial_match: 0.5
    parsing_notes: >
      Modern parsing with real semantic credit for closely related tools/
      skills, not just literal phrase hits. The most forgiving platform in
      this list for a resume that demonstrates a skill without naming the
      JD's exact keyword for it.

  "Lever":
    exact_match: 0.9
    semantic_match: 0.75
    partial_match: 0.5
    parsing_notes: >
      Comparable to Greenhouse -- modern parsing, reasonable semantic
      credit. No platform-specific quirk beyond the shared match_weights
      above.
