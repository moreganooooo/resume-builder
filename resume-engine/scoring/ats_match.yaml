# scoring/ats_match.yaml
# Defines the mathematical weights for comparing candidate resume vs. target job description.

match_weights:
  exact_match: 1.0    # e.g., JD asks for "Python", resume says "Python"
  semantic_match: 0.7 # e.g., JD asks for "Data Visualization", resume says "Tableau"
  partial_match: 0.4  # e.g., JD asks for "Salesforce Administration", resume says "Salesforce User"

section_multipliers:
  recent_experience: 1.2 # Skills used in the last 3 years carry more weight
  older_experience: 0.8  # Skills used 4+ years ago
  skills_section: 1.0    # Baseline weight
  summary_section: 0.5   # Lowest weight; telling, not showing

thresholds:
  excellent_match: 85 # Ready to apply
  good_match: 70      # Needs tailoring
  weak_match: 50      # Missing core competencies

hard_requirements:
  penalty: -25 # Point deduction if a skill marked "Required" in JD is entirely missing

# Per-archetype overrides of match_weights/section_multipliers above, keyed to the
# archetype names in profile.yml's archetypes list. Not derived from data -- a first-pass
# guess at which match type should carry more weight for each archetype's kind of work.
# Tune these based on what critique_resume.md actually flags over time. An archetype not
# listed here just uses the top-level defaults.
archetype_overrides:
  "Lifecycle Marketing Specialist":
    exact_match: 1.0
    semantic_match: 0.6   # tool-specific work; less credit for "similar enough" tools
    partial_match: 0.4
    section_multipliers:
      recent_experience: 1.3 # ESP/CRM tooling changes fast; recency matters more here

  "Customer Onboarding & Implementation Specialist":
    exact_match: 1.0
    semantic_match: 0.6
    partial_match: 0.4
    section_multipliers:
      recent_experience: 1.3

  "Sales Enablement Specialist":
    exact_match: 0.9
    semantic_match: 0.85  # playbook/training/voice-governance reads as competence, not tool-name hits
    partial_match: 0.5

  "B2B Content Strategist":
    exact_match: 0.8
    semantic_match: 0.9   # writing quality and voice matter more than exact tool-keyword hits
    partial_match: 0.5

  "Customer Marketing Manager":
    exact_match: 0.9
    semantic_match: 0.75
    partial_match: 0.45