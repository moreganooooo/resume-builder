<!-- @dsCard group="Colors" viewport="700x150" name="Score tiers" subtitle="Interview-probability banding — colour always paired with a glyph" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:700px;height:150px;background:var(--tui-base);color:var(--tui-text);font-family:var(--font-mono);font-size:12px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px}.t{display:flex;gap:8px}.tier{flex:1;border:1px solid var(--tui-overlay);border-radius:4px;padding:10px 12px}.g{font-size:20px;font-weight:700}.n{font-size:11px;color:var(--tui-subtext);margin-top:6px}</style></head><body><div class="t">
<div class="tier"><div class="g" style="color:var(--tui-green)">✓ 4.6</div><div class="n">strong · ≥ 4.2</div></div>
<div class="tier"><div class="g" style="color:var(--tui-yellow)">✦ 3.9</div><div class="n">good · ≥ 3.8</div></div>
<div class="tier"><div class="g" style="color:var(--tui-text)">★ 3.2</div><div class="n">fair · ≥ 3.0</div></div>
<div class="tier"><div class="g" style="color:var(--tui-red)">⊘ 2.4</div><div class="n">weak · &lt; 3.0</div></div>
<div class="tier"><div class="g" style="color:var(--tui-muted)">−</div><div class="n">not evaluated</div></div>
</div></body></html>
