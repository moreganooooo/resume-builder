<!-- @dsCard group="Motion" viewport="700x180" name="Thinking gradient & confetti" subtitle="The two decorative colour sequences — canonical order, read from tokens" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:700px;height:180px;background:var(--tui-base);color:var(--tui-text);font-family:var(--font-mono);font-size:12px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:16px}.k{color:var(--tui-subtext);font-size:10px;margin-bottom:6px}.stops{display:flex;gap:4px}.stops div{flex:1;height:26px;border-radius:2px}.glyphs{display:flex;gap:14px;font-size:20px;align-items:center}.n{color:var(--tui-subtext);font-size:10px;margin-top:6px}</style></head><body><div><div class="k">Thinking gradient — six stops, left to right, during LLM work</div><div class="stops"><div style="background:var(--thinking-stop-1)"></div><div style="background:var(--thinking-stop-2)"></div><div style="background:var(--thinking-stop-3)"></div><div style="background:var(--thinking-stop-4)"></div><div style="background:var(--thinking-stop-5)"></div><div style="background:var(--thinking-stop-6)"></div></div><div class="n">Peach → Teal → Mauve → Lavender → Blue → Sky</div></div>
<div><div class="k">Confetti — eight glyphs over six colours, toast celebrations only</div><div class="glyphs"><span style="color:var(--confetti-1)">✦</span><span style="color:var(--confetti-2)">✧</span><span style="color:var(--confetti-3)">★</span><span style="color:var(--confetti-4)">◆</span><span style="color:var(--confetti-5)">●</span><span style="color:var(--confetti-6)">■</span><span style="color:var(--confetti-1)">•</span><span style="color:var(--confetti-3)">✢</span><span class="n" style="margin:0 0 0 8px">gravity 0.05/frame · drag 0.95 · 20–35 frame lifetimes · suppressed under reduced motion</span></div></div></body></html>
