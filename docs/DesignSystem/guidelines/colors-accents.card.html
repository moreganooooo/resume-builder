<!-- @dsCard group="Colors" viewport="700x190" name="Accents" subtitle="Charmtone palette — 4.5:1 on Base and Surface, except Sky (Base only)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:700px;height:190px;background:var(--tui-base);color:var(--tui-text);font-family:var(--font-mono);font-size:12px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:44px;border-radius:2px}.lab{margin-top:6px;color:var(--tui-text);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hex{color:var(--tui-subtext);font-size:10px}.note{color:var(--tui-subtext);font-size:10px;opacity:.75}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--tui-blue)"></div><div class="lab">Blue</div><div class="hex">#4dabf7</div><div class="note">INFO</div></div><div class="sw"><div class="chip" style="background:var(--tui-mauve)"></div><div class="lab">Mauve</div><div class="hex">#ff60ff</div><div class="note">BRAND_ACCENT</div></div><div class="sw"><div class="chip" style="background:var(--tui-green)"></div><div class="lab">Green</div><div class="hex">#9ab63f</div><div class="note">SUCCESS</div></div><div class="sw"><div class="chip" style="background:var(--tui-yellow)"></div><div class="lab">Yellow</div><div class="hex">#f5ef34</div><div class="note">WARNING</div></div></div>
<div class="row"><div class="sw"><div class="chip" style="background:var(--tui-sky)"></div><div class="lab">Sky</div><div class="hex">#a47bff</div><div class="note">BRAND · Base only</div></div><div class="sw"><div class="chip" style="background:var(--tui-peach)"></div><div class="lab">Peach</div><div class="hex">#ff985a</div><div class="note">decorative</div></div><div class="sw"><div class="chip" style="background:var(--tui-red)"></div><div class="lab">Red</div><div class="hex">#ff7b99</div><div class="note">ERROR</div></div><div class="sw"><div class="chip" style="background:var(--tui-teal)"></div><div class="lab">Teal</div><div class="hex">#12e6c8</div><div class="note">decorative</div></div></div><script>for(const sw of document.querySelectorAll(".sw")){const h=sw.querySelector(".hex");const v=getComputedStyle(sw.querySelector(".chip")).backgroundColor.match(/\d+/g);if(v&&h)h.textContent="#"+v.slice(0,3).map(n=>(+n).toString(16).padStart(2,"0")).join("")}</script></body></html>
