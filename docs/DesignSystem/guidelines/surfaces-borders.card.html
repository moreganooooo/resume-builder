<!-- @dsCard group="Brand" viewport="700x180" name="Border states" subtitle="Depth is border colour and background step. There are no shadows anywhere." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:700px;height:180px;background:var(--tui-base);color:var(--tui-text);font-family:var(--font-mono);font-size:12px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px}.r{display:flex;gap:10px}.b{flex:1;border:1px solid;border-radius:4px;padding:10px 12px;font-size:11px}.k{color:var(--tui-subtext);font-size:10px;margin-top:4px}</style></head><body><div class="r">
<div class="b" style="border-color:var(--tui-overlay)">Idle<div class="k">detail pane, empty state</div></div>
<div class="b" style="border-color:var(--tui-blue)">Active<div class="k">focused list, modal</div></div>
<div class="b" style="border-color:var(--tui-mauve)">Focus<div class="k">help overlay</div></div>
<div class="b" style="border-color:var(--tui-peach)">Warning<div class="k">viewport too small</div></div>
<div class="b" style="border-color:var(--tui-teal);background:var(--tui-mauve);color:var(--tui-base);font-weight:700">Toast<div class="k" style="color:var(--tui-base)">celebration</div></div>
</div>
<div style="color:var(--tui-subtext);font-size:11px">Base → Surface → Overlay is the whole elevation scale. Overlay is a border token and must never carry text.</div></body></html>
