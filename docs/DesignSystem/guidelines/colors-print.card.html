<!-- @dsCard group="Colors" viewport="700x150" name="Print palette" subtitle="The whole PDF palette. No colour ever enters the resume." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:700px;height:150px;background:var(--tui-base);color:var(--tui-text);font-family:var(--font-mono);font-size:12px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:44px;border-radius:2px}.lab{margin-top:6px;color:var(--tui-text);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hex{color:var(--tui-subtext);font-size:10px}.note{color:var(--tui-subtext);font-size:10px;opacity:.75}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#000000"></div><div class="lab">Print Text</div><div class="hex">#000000</div></div><div class="sw"><div class="chip" style="background:#ffffff"></div><div class="lab">Print Paper</div><div class="hex">#ffffff</div></div><div class="sw"><div class="chip" style="background:#9aa3af"></div><div class="lab">Print Divider</div><div class="hex">#9aa3af</div><div class="note">0.018cm rules</div></div><div class="sw" style="flex:2"><div style="color:var(--tui-subtext);font-size:11px;line-height:1.6">The No-Bleed Rule: print colours never enter the TUI, TUI neons never enter the PDF. The boundary is absolute.</div></div></div><script>for(const sw of document.querySelectorAll(".sw")){const h=sw.querySelector(".hex");const v=getComputedStyle(sw.querySelector(".chip")).backgroundColor.match(/\d+/g);if(v&&h)h.textContent="#"+v.slice(0,3).map(n=>(+n).toString(16).padStart(2,"0")).join("")}</script></body></html>
