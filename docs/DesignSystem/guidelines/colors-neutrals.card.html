<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Catppuccin Mocha structural tones — Base, Surface, Overlay, Text, Subtext" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:700px;height:150px;background:var(--tui-base);color:var(--tui-text);font-family:var(--font-mono);font-size:12px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:44px;border-radius:2px}.lab{margin-top:6px;color:var(--tui-text);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hex{color:var(--tui-subtext);font-size:10px}.note{color:var(--tui-subtext);font-size:10px;opacity:.75}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--tui-base)"></div><div class="lab">Base</div><div class="hex">#1e1e2e</div><div class="note">app bg</div></div><div class="sw"><div class="chip" style="background:var(--tui-surface)"></div><div class="lab">Surface</div><div class="hex">#313244</div><div class="note">bars, panels</div></div><div class="sw"><div class="chip" style="background:var(--tui-overlay)"></div><div class="lab">Overlay</div><div class="hex">#45475a</div><div class="note">borders only</div></div><div class="sw"><div class="chip" style="background:var(--tui-text)"></div><div class="lab">Text</div><div class="hex">#cdd6f4</div></div><div class="sw"><div class="chip" style="background:var(--tui-subtext)"></div><div class="lab">Subtext</div><div class="hex">#a6adc8</div><div class="note">muted text</div></div></div><script>for(const sw of document.querySelectorAll(".sw")){const h=sw.querySelector(".hex");const v=getComputedStyle(sw.querySelector(".chip")).backgroundColor.match(/\d+/g);if(v&&h)h.textContent="#"+v.slice(0,3).map(n=>(+n).toString(16).padStart(2,"0")).join("")}</script></body></html>
