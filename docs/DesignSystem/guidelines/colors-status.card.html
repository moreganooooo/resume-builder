<!-- @dsCard group="Colors" viewport="700x140" name="Pipeline status" subtitle="Status pills — Base text on the status colour, uppercased" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:700px;height:140px;background:var(--tui-base);color:var(--tui-text);font-family:var(--font-mono);font-size:12px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px}.p{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:2px 8px;font-weight:700;font-size:11px;color:#1e1e2e}</style></head><body><div class="p">
<span class="pill" style="background:var(--tui-green)">OFFER</span>
<span class="pill" style="background:var(--tui-mauve)">INTERVIEW</span>
<span class="pill" style="background:var(--tui-peach)">RESPONDED</span>
<span class="pill" style="background:var(--tui-blue)">APPLIED</span>
<span class="pill" style="background:var(--tui-sky)">EVALUATED</span>
<span class="pill" style="background:var(--tui-yellow)">SKIP</span>
<span class="pill" style="background:var(--tui-subtext)">REJECTED</span>
<span class="pill" style="background:var(--tui-subtext)">DISCARDED</span>
</div>
<div style="color:var(--tui-subtext);font-size:11px">Closed-out statuses share Subtext — rejected must not read like responded.</div></body></html>
