<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Glamour report page" description="A rendered markdown report in the detail pane — scrollable viewport, no emoji, keyboard-only." -->
<helmet><script src="./ds-base.js"></script><style>html,body{height:100%;margin:0}body{background:#14141f}</style></helmet>
<div style="width:100%;height:100vh;background:var(--tui-base);font-family:var(--font-mono);font-size:var(--tui-font-size);line-height:var(--tui-line-height);color:var(--tui-text);display:flex;flex-direction:column;overflow:hidden">
<x-import component-from-global-scope="ResumeBuilderDesignSystem_2d03b1.TuiHeaderBar" icon="report" gradient="progress" title="✦ WEEKLY REPORT ✧" info="{{ headerInfo }}" hint-size="100%,21px"></x-import>
<div style="background:var(--tui-surface);color:var(--tui-subtext);padding:0 var(--pad-h);display:flex;gap:16px"><span>profiles/morgan/reports/2026-W38.md</span><span>{{ scroll }}</span></div>
<div style="flex:1;display:flex;gap:8px;padding:4px var(--pad-h);min-height:0">
<div style="flex:0 0 28%;min-width:0;display:flex">
<x-import component-from-global-scope="ResumeBuilderDesignSystem_2d03b1.TuiPanel" variant="active" pad="tight" dc-props="{{ fillCol }}" hint-size="100%,100%">
<div style="color:var(--tui-subtext);letter-spacing:.14em;padding-bottom:4px">SECTIONS</div>
<sc-for list="{{ sections }}" as="s" hint-placeholder-count="5">
<sc-if value="{{ s.selected }}" hint-placeholder-val="{{ false }}">
<div style="padding:1px 0 1px 7.4px;cursor:pointer;border-left:1px solid var(--tui-mauve)" onClick="{{ s.select }}"><span style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">{{ s.label }}</span></div>
</sc-if>
<sc-if value="{{ s.unselected }}" hint-placeholder-val="{{ true }}">
<div style="padding:1px 0 1px 8.4px;cursor:pointer;border-left:1px solid transparent;opacity:calc(1 - var(--dim-fraction))" onClick="{{ s.select }}"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">{{ s.label }}</span></div>
</sc-if>
</sc-for>
</x-import>
</div>
<div style="flex:1;min-width:0;display:flex">
<x-import component-from-global-scope="ResumeBuilderDesignSystem_2d03b1.TuiPanel" variant="idle" pad="detail" dc-props="{{ fillDoc }}" hint-size="100%,100%">
<x-import component-from-global-scope="ResumeBuilderDesignSystem_2d03b1.GlamourDoc" source="{{ source }}" hint-size="100%,100%"></x-import>
</x-import>
</div>
</div>
<x-import component-from-global-scope="ResumeBuilderDesignSystem_2d03b1.TuiFooterBar" primary="{{ primary }}" actions="{{ actions }}" system="{{ system }}" brand="resume-builder dashboard" hint-size="100%,21px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
// Glamour owns the typography inside the pane — the template only supplies the
// frame and the markdown. Reports are technical, so Glamour runs with emoji off.
// Replace `source` with the generated report; keep headings at `##`/`###` so the
// section list and the document stay in the same words.
class Component extends DCLogic {
  state = { section: 0 };
  docs = [
    `## Where things stand\n\nSixty-four roles scanned this week, twelve scored at or above 4.0.\n\n- **Applied** 9 (up 3 week over week)\n- **Responded** 4\n- **Interview** 2\n\nThe applied count hit the weekly goal on Thursday.`,
    `## What is working\n\nDirect company boards continue to out-convert aggregated sources.\n\n- Direct boards: 31 roles, 6 responses\n- Aggregators: 33 roles, 1 response\n\n**Recommendation:** spend the scan budget on local employer boards.`,
    `## Coverage gaps\n\nTwelve roles are scored but have no tailored bullets yet.\n\n- People management appears in 7 postings and is the weakest matrix row at 31%\n- Two roles have no saved posting URL, so the scorer used the cached description`,
    `## Response times\n\nMedian first response: 6 days. The distribution is bimodal — automated rejections land inside 48 hours, human replies cluster around day 9.\n\nNothing older than 14 days has ever converted.`,
    `## Next actions\n\n1. Tailor the twelve pending roles — press **t** on each from Jobs\n2. Verify the four skills flagged stale in the Knowledge Base\n3. Re-scan the six local employer boards added on Tuesday`,
  ];
  renderVals() {
    const labels = ['Where things stand', 'What is working', 'Coverage gaps', 'Response times', 'Next actions'];
    return {
      headerInfo: 'Week 38 | 64 scanned | 9 applied',
      scroll: 'Section ' + (this.state.section + 1) + ' of ' + labels.length,
      fillCol: { style: { flex: 1, display: 'flex', flexDirection: 'column', overflowY: 'auto' } },
      fillDoc: { style: { flex: 1, overflowY: 'auto' } },
      sections: labels.map((label, i) => {
        const sel = i === this.state.section;
        return {
          label,
          selected: sel,
          unselected: !sel,
          select: () => this.setState({ section: i }),
        };
      }),
      source: this.docs[this.state.section],
      primary: [{ key: '↑↓', desc: 'section' }],
      actions: [{ key: 'space', desc: 'page' }, { key: 'g/G', desc: 'top/bot' }, { key: 'e', desc: 'export md' }],
      system: [{ key: 'esc', desc: 'back' }, { key: 'q', desc: 'quit' }],
    };
  }
}
</script>
</body>
</html>
