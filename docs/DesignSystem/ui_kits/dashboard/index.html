<!-- @dsCard group="Dashboard (TUI)" viewport="1280x800" name="Dashboard" subtitle="Click-through recreation of the Bubble Tea dashboard — menu, pipeline, jobs, progress, knowledge base" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>resume-builder dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#14141f;font-family:var(--font-mono);font-size:var(--tui-font-size);line-height:var(--tui-line-height);color:var(--tui-text);display:flex;align-items:center;justify-content:center;padding:16px}
#root{width:1248px;height:768px}
.term{width:100%;height:100%;background:var(--tui-base);overflow:hidden;display:flex;flex-direction:column;position:relative}
a{color:var(--tui-blue)}a:hover{color:var(--tui-mauve)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--tui-overlay)}
</style></head>
<body><div id="root"></div>
<script type="text/babel" src="MainMenu.jsx"></script>
<script type="text/babel" src="PipelineScreen.jsx"></script>
<script type="text/babel" src="JobsScreen.jsx"></script>
<script type="text/babel" src="ProgressScreen.jsx"></script>
<script type="text/babel" src="InsightsScreen.jsx"></script>
<script type="text/babel" src="DocumentsScreen.jsx"></script>
<script type="text/babel" src="KBScreen.jsx"></script>
<script type="text/babel">
const D = window.RB_DATA;

function App() {
  const [screen, setScreen] = React.useState("menu");
  const back = React.useCallback(() => setScreen("menu"), []);
  const open = (cmd) => setScreen(
    cmd === "Pipeline" ? "pipeline" : cmd === "Progress" ? "progress" : cmd === "Insights" ? "insights" :
    cmd === "Jobs" ? "jobs" : cmd === "Knowledge Base" ? "kb" : cmd === "Documents" ? "documents" : "menu");

  return (
    <div className="term">
      {screen === "menu" && <MainMenu profile={D.profile} onOpen={open} />}
      {screen === "pipeline" && <PipelineScreen jobs={D.jobs} metrics={D.metrics} onBack={back} />}
      {screen === "jobs" && <JobsScreen jobs={D.jobs} onBack={back} />}
      {screen === "progress" && <ProgressScreen metrics={D.metrics} onBack={back} />}
      {screen === "kb" && <KBScreen items={D.kb} profile={D.profile} onBack={back} />}
      {screen === "insights" && <InsightsScreen metrics={D.metrics} onBack={back} />}
      {screen === "documents" && <DocumentsScreen onBack={back} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
