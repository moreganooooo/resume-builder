<!DOCTYPE html><html><head><meta charset="utf-8"><title>resume-builder CLI</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:#14141f;font-family:var(--font-mono);font-size:var(--tui-font-size);line-height:var(--tui-line-height);color:var(--tui-text);padding:16px;display:flex;justify-content:flex-start}
#root{flex:0 0 1248px;width:1248px}
.term{background:var(--tui-base);padding:21px;min-height:868px}
a{color:var(--tui-blue)}a:hover{color:var(--tui-mauve)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--tui-overlay)}
</style></head>
<body><div id="root"></div>
<script type="text/babel" src="CliScreens.jsx"></script>
<script type="text/babel" src="CliHelp.jsx"></script>
<script type="text/babel" src="CliOnboarding.jsx"></script>
<script type="text/babel">
function CliApp() {
  const [screen, setScreen] = React.useState("home");
  const back = React.useCallback(() => setScreen("home"), []);
  return (
    <div className="term">
      {screen === "home" && <CliHome onOpen={setScreen} />}
      {screen === "find" && <BannerMenu title="Find Jobs" groups={FIND_GROUPS} onBack={back} />}
      {screen === "build" && <BannerMenu title="Build Documents" groups={BUILD_GROUPS} onBack={back} />}
      {screen === "settings" && <SettingsScreen onBack={back} />}
      {screen === "bullets" && <CliBulletBank onBack={back} />}
      {screen === "knowledge" && <CliKnowledge onBack={back} />}
      {screen === "onboarding" && <CliOnboarding onBack={back} onRun={() => setScreen("running")} />}
      {screen === "running" && <CliExecution onBack={() => setScreen("onboarding")} />}
      {screen === "help" && <CliHelp onBack={back} />}
    </div>
  );
}

const { CliModeBar, CliMenu } = window.ResumeBuilderDesignSystem_2d03b1;

function SettingsScreen({ onBack }) {
  const flat = SETTINGS_GROUPS.flatMap((g) => g.items);
  const count = flat.length;
  const [cursor, setCursor] = React.useState(0);
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === "ArrowDown" || e.key === "j") setCursor((c) => Math.min(c + 1, count - 1));
      else if (e.key === "ArrowUp" || e.key === "k") setCursor((c) => Math.max(c - 1, 0));
      else if (e.key === "Escape") onBack();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [count, onBack]);
  return (
    <>
      <CliModeBar screen="SETTINGS & UPKEEP" />
      <div style={{ height: 34 }}></div>
      <ScreenTitle>Settings &amp; Upkeep</ScreenTitle>
      <CliMenu groups={SETTINGS_GROUPS} cursor={cursor} onSelect={(i) => { setCursor(i); flat[i].back && onBack(); }} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CliApp />);
</script></body></html>
