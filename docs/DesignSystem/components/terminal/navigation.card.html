<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>*{margin:0;padding:0;box-sizing:border-box}body{width:760px;height:470px;background:var(--tui-base);padding:16px;font-family:var(--font-mono);font-size:12px;color:var(--tui-text)}.lbl{color:var(--tui-subtext);font-size:10px;letter-spacing:.08em;margin:12px 0 5px}.lbl:first-child{margin-top:0}.k{color:var(--tui-subtext);font-size:11px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { CommandPalette, HelpBar, Paginator, ScrollIndicator, TuiPanel } = window.ResumeBuilderDesignSystem_2d03b1;
const RESULTS=[{group:'Pipeline',label:'Tailor resume for selected role',match:[0,1,2],key:'t'},{group:'Jobs',label:'Toggle top matches only',match:[0,1,7],key:'T'},{group:'Global',label:'Take weekly report snapshot',match:[0,1,5],key:'r'},{group:'KB',label:'Cluster the bullet bank',match:[3,4]}];
function Demo(){const [open,setOpen]=React.useState(true);const [c,setC]=React.useState(0);const [exp,setExp]=React.useState(false);

<div className="lbl">PROGRESSIVE HELP — ? expands the bar in place; keys never move horizontally</div>
<HelpBar bindings={[{key:'↑↓',desc:'nav'},{key:'enter',desc:'open'},{key:'t',desc:'tailor'},{key:'/',desc:'search'},{key:'q',desc:'quit'}]} expanded={exp}
 groups={[{label:'Navigation',bindings:[{key:'↑↓ / jk',desc:'move'},{key:'g / G',desc:'top / bottom'},{key:'tab',desc:'next pane'}]},{label:'Actions',bindings:[{key:'enter',desc:'open'},{key:'t',desc:'tailor'},{key:'c',desc:'change status'}]},{label:'View',bindings:[{key:'v',desc:'board / list'},{key:'/',desc:'search'},{key:'s',desc:'sort'}]}]} />

<div style={{flex:1}}>

<div style={{height:8}}></div>

</div>

<ScrollIndicator offset={6} visible={8} total={42} />
</div>
</div>
</div>
