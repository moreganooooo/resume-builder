<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>*{margin:0;padding:0;box-sizing:border-box}body{width:700px;height:680px;background:var(--tui-base);padding:16px;font-family:var(--font-mono);font-size:12px}.lbl{color:var(--tui-subtext);font-size:10px;margin:0 0 4px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Modal, HelpOverlay, GlamourDoc } = window.ResumeBuilderDesignSystem_2d03b1;
const backdrop = "Pipeline list, dimmed and stripped of colour behind the dialog...";
function Demo(){
return (<div style={{display:'flex',flexDirection:'column',gap:14}}>
  <div className="lbl">Modal — status-change confirm</div>
  <div style={{height:150,position:'relative',overflow:'hidden'}}>
    <Modal title="Change status" backdrop={backdrop} footer="Enter/y confirm  Esc/n cancel">
      Move <b>Harlow &amp; Finch</b> to <span style={{color:'var(--tui-mauve)'}}>INTERVIEW</span>?
    </Modal>
  </div>
  <div className="lbl">HelpOverlay — the ? key on any screen</div>
  <div style={{height:250,position:'relative',overflow:'hidden'}}>
    <HelpOverlay title="Pipeline" backdrop={backdrop} categories={[
      {label:'Navigation',bindings:[{key:'↑ ↓ / j k',desc:'Move selection'},{key:'← → / h l',desc:'Cycle tabs'}]},
      {label:'Actions',bindings:[{key:'Enter',desc:'Open report'},{key:'c',desc:'Change status'}]},
    ]} />
  </div>
  <div className="lbl">GlamourDoc — rendered markdown</div>
  <GlamourDoc source={"### Figma\n\n- **Category:** Tools\n- **Confidence:** Working\n\nListed only — never claimed as ownership."} />
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
