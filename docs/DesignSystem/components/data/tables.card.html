<!-- @dsCard group="Components" viewport="760x430" name="Tables & trees" subtitle="Sortable keyboard table and the bullet-bank cluster hierarchy" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:760px;height:430px;background:var(--tui-base);padding:16px;font-family:var(--font-mono);font-size:12px;color:var(--tui-text)}.lbl{color:var(--tui-subtext);font-size:10px;letter-spacing:.08em;margin:12px 0 5px}.lbl:first-child{margin-top:0}.k{color:var(--tui-subtext);font-size:11px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { DataTable, ClusterTree, Paginator } = window.ResumeBuilderDesignSystem_2d03b1;
const tier=s=>s>=4.2?'var(--tui-green)':s>=3.8?'var(--tui-yellow)':s>=3?'var(--tui-text)':'var(--tui-red)';
const ROWS=[{company:'Northwind Labs',role:'Content Lead',score:4.6,days:3,status:'APPLIED'},{company:'Callahan Creek',role:'Brand Strategist',score:4.4,days:9,status:'EVALUATED'},{company:'Orchard Media',role:'Senior Writer',score:4.2,days:1,status:'INTERVIEW'},{company:'Harbor & Co',role:'Copy Director',score:3.9,days:14,status:'RESPONDED'},{company:'Meridian Group',role:'Comms Manager',score:3.4,days:21,status:'APPLIED'}];
const COLS=[{key:'company',label:'Company',width:'28%'},{key:'role',label:'Role',width:'28%'},{key:'score',label:'Score',align:'right',color:r=>tier(r.score),render:r=>r.score.toFixed(1)},{key:'days',label:'Days',align:'right',render:r=>r.days+'d'},{key:'status',label:'Status',align:'right'}];
const TREE=[{label:'Editorial strategy',count:34,children:[{label:'Ran the 2024 content refresh across 140 pages'},{label:'Set the house style guide, adopted by three teams'}]},{label:'Content operations',count:28,children:[{label:'Cut publication lead time from 11 days to 4'}]},{label:'People management',count:2,children:[{label:'Mentored two junior writers through promotion'}]},{label:'Analytics',count:19}];
function Demo(){const [c,setC]=React.useState(0);const [t,setT]=React.useState(1);
return (<div style={{display:'flex',gap:18}}>
<div style={{flex:'1.15'}}>
<div className="lbl">SORTABLE TABLE — one sorted column, so the arrow is unambiguous</div>
<DataTable columns={COLS} rows={ROWS} cursor={c} onSelect={setC} sortKey="score" sortDir="desc" />
<div style={{marginTop:10}}><Paginator page={0} pages={4} perPage={5} total={18} /></div>
<div className="k" style={{marginTop:10}}>Numeric columns right-align; the header is a caps rule, not a filled bar — the chrome budget has no room for a second bar.</div>
</div>
<div style={{flex:1}}>
<div className="lbl">CLUSTER TREE — the bullet bank, currently printed flat</div>
<ClusterTree nodes={TREE} cursor={t} onSelect={setT} />
<div className="k" style={{marginTop:10}}>Branch lines are Overlay: structure, never content. A cluster under three bullets is flagged Peach — usually the extractor mis-grouped rather than the user lacking the experience.</div>
</div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
