location:
  city: Getzville
  state: NY
  zip: "14068"
  radius_miles: 20
  workplace_mode: any
location_filter:
  always_allow:
    - "Remote"
  block:
    []
languages:
- en
# scoring_weights override removed 2026-09-13 so scoring matches morgan's
# (the defaults). It had funnel_friction_nudge: 2, doubling the remote-role
# penalty on interview odds. Existing evaluations keep the old nudge until
# re-evaluated -- it is baked into the stored funnel_friction subscore.
max_travel_percent: 10
employment_type:
- full_time
- part_time
- contract
- contract_to_hire
- temporary
compensation:
  annual_floor: 60000.0
  hourly_floor: 16.0

# Employers with no ATS board to track -- they post only to job boards.
# Every local Indeed posting from these is kept whatever its title, and
# reported under the "indeed_watchlist" scan source.
indeed_watch_companies:
  - "Sentient Science"
  - name: "Viridi Parente"
    aliases: ["Viridi"]
  - "Tapecon"

# Staffing-agency boards to watch (scan source "staffing_boards"). Their
# postings are tagged with the agency's name and filterable in the
# dashboard. type: jsonld (detail pages embed schema.org JobPosting) or
# hmg (Haley Marketing "hmg-jb" boards). See scripts/staffing_boards.py.
staffing_boards:
  - name: "Lighthouse Technology Services"
    url: "https://jobs.lhtservices.com/"
    type: hmg
  - name: "ComputerPeople"
    url: "https://jobs.cpstaffing.com/?_select_area=cp-buf"
    type: jsonld
