# board_scanner's "boards"/"ats" sources: title/location prefilter
# applied before a listing becomes a JD file. positive seeded from your
# target roles during bootstrap -- add near-miss titles you keep seeing
# as you scan real postings. Empty negative/block lists are permissive
# by design. See profiles/morgan/board_scanner/scan_filters.yml for a
# real worked example (100+ positive terms, 300+ negative terms).
title_filter:
  positive:
    - "Data Scientist"
    - "Data Engineer"
    - "Data Analyst"
    - "Machine Learning"
    - "Data Engineer"
    - "Quantitative Analyst"
    - "Business Intelligence"
    - "Research Analyst"
    - "Analytics Engineer"
    - "Research Scientist"
    - "Applied Scientist"
    - "IoT"
    - "Sensor Data"
  negative:
    - "Chief Data Officer"
    - "Chief Scientist"
    - "VP of Data"
    - "VP Data Science"
    - "Director of Data Science"
    - "Head of Data Science"
    - "Director of Analytics"
    # Staff/Principal: median interview odds 2.95 vs 3.80 for unmarked titles
    # (2026-09-13). Matching is substring, so "Staff " keeps its trailing
    # space (not "Staffing ...") and ", Staff" / "(Staff)" catch suffixed titles.
    - "Principal"
    # Specific "Staff <role>" phrases rather than "Staff ": the latter also
    # matched "Member of Technical Staff - ...", an AI-lab title used at
    # many levels (those rows scored 3.55-3.70 odds, well above staff-level).
    - "Software Engineer"
    - "Mobile Developer"
    - "iOS"
    - "Android"
    - "DevOps Engineer"
    - "Java Developer"
    - "Salesforce Admin"
