narrative:
  headline: "Creative marketing and systems leader who writes campaigns that perform, builds infrastructure that lasts, and drives user adoption"

  exit_story: >
    After 8 years building the sales development and content infrastructure at Treering Yearbooks
    from one of the first two outbound hires to Senior SDR Manager and head of the Content Committee,
    I took intentional time in 2024-25 to support a loved one's health and invest in professional growth.
    I'm returning with clarity: I want a remote IC role where human-first messaging, campaign systems,
    and the blend of creative + strategic thinking are the job, not a side note.

superpowers:
  - "Human-first writing that earns opens, replies, and trust, not just clicks. Campaigns went viral internally; reps borrowed niche sequences for audiences they weren't designed for because the writing was that good."
  - "Building content systems that last: Content Committee, sequence library of 100+ assets, voice/tone guidelines, and SDR process map all still in use years after creation."
  - "CRM fluency: Salesforce + Outreach.io operations, data hygiene, segmentation, reporting. Recovered $3M+ in stale pipeline through systematic account audits."
  - "Translating strategy into campaigns: segment, write, A/B test, iterate, report to leadership. Full loop."
  - "Training design that actually transfers: live workshops + async documentation + process maps for 20+ employees across remote teams."
  - "Empathy-driven personalization at scale: Vidyard video prospecting, Thnks gifting (coffee, tree donations), Facebook group outreach for hard-to-reach PTA audiences."
  - "Translating complex platform mechanics into digestible user workflows: Guided a remote team through a massive Salesforce Person Accounts migration via 1:1 troubleshooting and rebuilt system views, and mapped a massive technical process into a user-friendly internal help-site."

background_context: >
  Morgan came up through three converging tracks that merged fully at Treering:
  (1) Journalism/writing, KCKCC editor-in-chief, KU Journalism BS, Callahan Creek, VML;
  (2) Visual design, UDP intern, Element 8 → Strategy LLC Lead Designer, JCCC Graphic Design;
  (3) Sales/outreach, IST BDR, Treering SDR Manager.
  This combination is rare: most email marketers can write OR operate the stack; Morgan does both.
  Most enablement specialists come from sales OR content; Morgan comes from both simultaneously.

