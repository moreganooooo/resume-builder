role_track:
  exclude_manager: true
# What Indeed searches for (max 3 terms, one scrape each). Local clerical and
# retail roles only surface if Indeed is asked for them; email/lifecycle roles
# are remote and come from the boards/ATS scans. Added 2026-09-14.
indeed_search_terms:
- marketing
- administrative assistant
- sales associate
# Physical and phone limits, judged deterministically on every evaluation
# (scripts/work_constraints.py). Standing for long periods, heavy lifting and
# manual labor are deal-breakers; light/medium lifting is fine. Phone-heavy
# work costs points but is not ruled out. In-person roles pay double the
# stress-signal penalty, so only calm onsite/hybrid roles rank well.
work_constraints:
  no_prolonged_standing: true
  no_manual_labor: true
  max_lift_lbs: 25
  heavy_lift_lbs: 40
  lift_penalty: 0.3
  phone_heavy_penalty: 0.75
  onsite_stress_multiplier: 2.0
