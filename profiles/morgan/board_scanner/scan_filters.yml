# Vendored from career-ops/portals.yml (location_filter + title_filter
# blocks), 2026-07-26 -- ported for resume-builder's scan_boards.py
# board-provider prefilter. This repo's copy is authoritative going
# forward; edit here, not in career-ops. See scripts/scan_boards.py for
# the Python port of scan.mjs's buildTitleFilter/buildLocationFilter logic
# that reads this file.
#
# NOTE: career-ops's own portals.yml has `location_filter:` as a flat list
# (the always_allow terms) with `block:` as a SEPARATE top-level key --
# that doesn't match what scan.mjs's buildLocationFilter() actually reads
# (locationFilter.always_allow / .allow / .block), so location filtering
# is silently a no-op in career-ops today. Restructured correctly here
# (always_allow/block properly nested under location_filter) so it's not
# ported broken. Worth a fix upstream in career-ops too, separately.

# ---------------------------------------------------------------------
# Optional radius/workplace filter (scripts/location_filter.py).
#
# Uncommenting this block CHANGES how location filtering works: the
# keyword always_allow/block lists below stop being consulted, and every
# posting is judged instead on workplace mode and real distance from the
# origin here. That is deliberate -- the `block:` list rejects "Onsite"
# and "Hybrid" outright, so it has to stand down at exactly the moment a
# radius exists to take its place. Leave it commented to keep the
# historical keyword-only behavior.
#
#   zip           preferred origin; unambiguous where a city name needs a
#                 state to mean anything. Falls back to city + state.
#   radius_miles  straight-line, not driving. Road mileage in US metros
#                 runs ~1.2-1.4x, so 25 here is about a 30-mile drive.
#   workplace_mode  remote | hybrid | onsite | any
#                 A posting whose mode cannot be determined is NEVER
#                 dropped on mode alone -- providers often omit the field.
#
# Unresolvable locations ("Greater Austin Area") are kept for review
# rather than dropped: surfacing an unknown is cheap to eyeball, while
# silently discarding a commutable role is not.
#
# Edit this block from the menu: Settings & Upkeep -> Location & Commute
# Radius (scripts/location_settings.py), which preserves these comments.

location:
  city: Getzville
  state: NY
  zip: "14068"
  radius_miles: 25
  workplace_mode: any

location_filter:
